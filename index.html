<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF2F0">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>

<body>
<title>Hokkaido Momiji Drive</title>
<meta name="color-scheme" content="light">
<script>document.documentElement.setAttribute("data-theme","light")</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

}

  --accent:#E35A40; --accent-ink:#FFFFFF; --gold:#E2AE3E; --gold-soft:#3A2E12;
  --sea:#0D2128; --land:#1A2420; --land-line:#33433C; --lake:#16323D;
  --route-blue:#4A8BD6; --exp-green:#2FA36E; --ok:#3DBB72; --warn:#E39A2E;
  --d1:#5B95D6; --d2:#A77BD2; --d3:#E35A40; --d4:#2FAE90; --d5:#E89A2E; --d6:#D5609A; --d7:#8D9AA6;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#172019; --surface-2:#1C2622; --ink:#E5ECE8; --muted:#95A49D; --line:#2A3631;
  --accent:#E35A40; --accent-ink:#FFFFFF; --gold:#E2AE3E; --gold-soft:#3A2E12;
  --sea:#0D2128; --land:#1A2420; --land-line:#33433C; --lake:#16323D;

  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 10px;position:relative;z-index:20}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.02em}
.clock{font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--muted);line-height:1.3;white-space:nowrap}
.clock b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.days::-webkit-scrollbar{display:none}
.day-chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px;cursor:pointer;text-align:left;min-width:58px}
.day-chip .dn{font-family:var(--font-display);font-weight:700;font-size:16px;display:block;line-height:1.1}
.day-chip .dd{font-size:12px;color:var(--muted);display:block;white-space:nowrap}
.day-chip[aria-pressed="true"]{border-color:var(--dc);background:var(--dc);color:#fff}
.day-chip[aria-pressed="true"] .dd{color:rgba(255,255,255,.85)}
.day-chip .today-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:4px;vertical-align:middle}

/* panels */
.panels{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 28px}
.panel[hidden]{display:none!important}
.panel.map-panel{padding:0;overflow:hidden}

/* bottom nav */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);position:relative;z-index:20}
.tab{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.day-chip:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* day header */
.day-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.day-num{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:.9;color:var(--dc)}
.day-title{margin:0;font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.25;text-wrap:balance}
.day-meta{font-size:14px;color:var(--muted);margin-top:2px}
.hotel-line{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.hotel-line b{font-weight:600}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.small{padding:4px 10px;font-size:13.5px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{display:grid;grid-template-columns:44px 18px minmax(0,1fr);gap:0 8px;padding-bottom:12px;position:relative}
.ti .tm{font-family:var(--font-mono);font-size:13.5px;font-weight:600;text-align:right;padding-top:3px;color:var(--ink);line-height:1.2}
.ti .tm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ti .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--dc);margin:5px 0 0 3px;position:relative;z-index:1}
.ti.k-drive .dot{border-style:dashed;background:var(--bg)}
.ti.k-bf .dot{border-color:var(--gold);background:var(--gold)}
.ti.k-opt{opacity:.92}
.ti.k-opt .dot{border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.ti.k-drive .card{background:transparent;border-style:dashed}
.ti.k-bf .card{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.ti.is-now .card{box-shadow:0 0 0 2px var(--dc)}
.c-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c-kind{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.c-name{font-weight:600;font-size:16.5px;line-height:1.35;margin:1px 0 2px}
.c-note{font-size:14.5px;color:var(--muted);margin:0}
.c-warn{font-size:14px;color:var(--warn);margin:4px 0 0}
.c-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.pill.new{color:var(--ok)} .pill.opt{color:var(--muted)} .pill.chg{color:var(--warn)}
.rt{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12.5px;color:#fff;background:var(--route-blue);border-radius:3px 3px 9px 9px;padding:1px 6px;min-width:30px;letter-spacing:.02em}
.rt.exp{background:var(--exp-green);border-radius:4px}
.rt.pref{background:#fff;color:var(--route-blue);border:1.5px solid var(--route-blue);border-radius:50%;min-width:24px;height:24px;padding:0}
.scenic-mini{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.scenic-mini li{font-size:13.5px;color:var(--muted);display:flex;gap:6px}
.scenic-mini li b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:12.5px;min-width:44px}

.alert{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:950;background:var(--accent);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .35s ease}

async function refreshRate(force){
  if(store.get("rateManual",false)&&!force) return; const last=store.get("rateAt",0); if(!force&&Date.now()-last<6*3600e3) return;
  const tries=[["https://api.frankfurter.dev/v1/latest?base=JPY&symbols=THB",j=>[j.rates&&j.rates.THB,"ธนาคารกลางยุโรป "+(j.date||"")]],["https://api.frankfurter.app/latest?from=JPY&to=THB",j=>[j.rates&&j.rates.THB,"ธนาคารกลางยุโรป "+(j.date||"")]],["https://open.er-api.com/v6/latest/JPY",j=>[j.rates&&j.rates.THB,"open.er-api.com"]]];
  for(const [u,f] of tries){ try{ const r=await fetch(u); if(!r.ok) continue; const [v,src]=f(await r.json()); if(v>0){ store.set("rate",+(+v).toFixed(4)); store.set("rateSrc",src); store.set("rateAt",Date.now()); if(force) store.set("rateManual",false); if(curTab==="info") renderInfo(); return; } }catch(e){} } }

/* ---------- live location on map ---------- */
let meMk=null, meAcc=null, meShown=null, meAnim=null, meKind=null, meHd=null, follow=true, legLayer=null, tilesOk=false, lastDriveH=0;
const FRAMED=(()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
const CAN_POP=FRAMED&&/^https?:$/.test(location.protocol);
function meIcon(kind,hd){ return L.divIcon({className:"",iconSize:[28,28],iconAnchor:[14,14],html:`<div class="me ${kind}">${hd!=null&&kind==="gps"?`<i style="transform:rotate(${Math.round(hd)}deg)"></i>`:""}<b></b></div>`}); }
function placeMe(ll,kind,acc,hd){
  if(!map||!ll) return;
  hd=(hd!=null&&!isNaN(hd))?Math.round(hd/10)*10:null;
  if(!meMk){ meAcc=L.circle(ll,{radius:0,interactive:false,stroke:false,fillColor:"#2F80ED",fillOpacity:.14}).addTo(map); meMk=L.marker(ll,{icon:meIcon(kind,hd),zIndexOffset:6000,interactive:false,keyboard:false}).addTo(map); meShown=ll; meKind=kind; meHd=hd; }
  if(kind!==meKind||hd!==meHd){ meMk.setIcon(meIcon(kind,hd)); meKind=kind; meHd=hd; }
  meAcc.setRadius(kind==="gps"?Math.min(acc||0,500):0);
  const from=meShown||ll, t0=performance.now(), D=950; cancelAnimationFrame(meAnim);
  const step=now=>{ const k=Math.min(1,(now-t0)/D); const p=[from[0]+(ll[0]-from[0])*k,from[1]+(ll[1]-from[1])*k]; meMk.setLatLng(p); meAcc.setLatLng(p); meShown=p; if(k<1) meAnim=requestAnimationFrame(step); };
  meAnim=requestAnimationFrame(step);
  if(follow&&curTab==="map"){ if(map.getZoom()<(tilesOk?11:9)) map.setView(ll,tilesOk?14:10,{animate:false}); else map.panTo(ll,{animate:true,duration:.95,easeLinearity:1,noMoveStart:true}); }
}
function syncLoc(){ const c=$(".loc-ctl"); if(c) c.classList.toggle("on",follow&&!!(gpsLive()||drive)); }
function locate(){
  follow=true; syncLoc();
  if(gps.blocked||!("geolocation" in navigator)){ openSheet(gpsHelp()); return; }
  if(gps.watch==null) startGps();
  if(gpsLive()) map.setView(gps.pos.ll,Math.max(map.getZoom(),tilesOk?14:10));
  else if(drive&&meShown) map.setView(meShown,Math.max(map.getZoom(),12));
}

/* opening_hours ("Mo-Fr 10:00-20:00; Sa,Su 09:00-18:00; Tu off") → open now? Unknown formats return null and the raw text is shown */
function ohState(oh){
  if(!oh) return null; const s=String(oh).trim(); if(/^24\/7$/.test(s)) return {open:true,txt:"เปิด 24 ชม."};
  const DD=["Su","Mo","Tu","We","Th","Fr","Sa"], j=jst(), dow=new Date(Date.UTC(j.y,j.m-1,j.d)).getUTCDay(), now=j.h*60+j.mi;
  let today=null, any=false;
  for(const raw of s.split(";")){ const rule=raw.trim(); if(!rule) continue;
    const m=rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?)(?:\s*,\s*(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?)*)?\s*(.*)$/); if(!m) return null;
    let hit=!m[1];
    if(m[1]) for(const part of m[1].split(",")){ const pp=part.trim(); if(pp==="PH") continue; const [x,y]=pp.split("-").map(v=>v.trim()); const ia=DD.indexOf(x), ib=y?DD.indexOf(y):ia; if(ia<0||ib<0) return null; for(let k=ia,g=0;g<8;k=(k+1)%7,g++){ if(k===dow) hit=true; if(k===ib) break; } }
    const t=m[2].trim(); if(!t&&m[1]) continue; any=true; if(!hit) continue;
    if(/^(off|closed)$/i.test(t)){ today="off"; continue; }
    const rng=[]; for(const p of t.split(",")){ const mm=p.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/); if(!mm) return null; rng.push([+mm[1]*60+ +mm[2],+mm[3]*60+ +mm[4]]); }
    today=rng; }
  if(!any) return null;
  if(today==null||today==="off") return {open:false,txt:"วันนี้ปิด"};
  for(const [a,b] of today){ const e=b<=a?b+1440:b; if(now>=a&&now<e) return {open:true,soon:e-now<=45,txt:(e-now<=45?"ใกล้ปิด ":"เปิดอยู่ ")+"ถึง "+fmtMin(b)}; }
  const nx=today.map(r=>r[0]).filter(a=>a>now).sort((x,y)=>x-y)[0]; return {open:false,txt:nx!=null?"ยังไม่เปิด เปิด "+fmtMin(nx):"ปิดแล้ววันนี้"}; }
function ohBadge(h){ if(!h) return ""; const o=ohState(h); if(!o) return `<span class="oh">🕘 ${esc(h)}</span>`; return `<span class="oh ${o.open?(o.soon?"soon":"open"):"shut"}">${o.open?"🟢":"🔴"} ${esc(o.txt)}</span>`; }

    return {lang,title,extract:j.extract||"",url:(j.content_urls&&j.content_urls.mobile&&j.content_urls.mobile.page)||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`}; }catch(e){ return {lang,title,extract:"",url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`}; } }

  n.at=""; const nat=()=>toMin(planItems(di).find(x=>x._i===key).t);
  let N=nat(); if(S>=N){ if(S>N) n.at=fmtMin(S); return {msg:S>N?`ว่าง ${S-N} นาทีก่อนรายการนี้`:""}; }

let drive=store.get("drive",null), driveTimer=null, audio=null, wake=null;
const gps={watch:null,pos:null,err:null,blocked:false};
function beep(){
  try{ if(!audio) return; const t=audio.currentTime; [0,0.28,0.56].forEach((o,i)=>{ const os=audio.createOscillator(), g=audio.createGain(); os.type="sine"; os.frequency.value=[784,988,1319][i]; g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.35,t+o+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.26); os.connect(g).connect(audio.destination); os.start(t+o); os.stop(t+o+0.3); }); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
}
async function lockScreen(){ try{ if("wakeLock" in navigator) wake=await navigator.wakeLock.request("screen"); }catch(e){ wake=null; } }
function km(a,b){ const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dg=(b[1]-a[1])*r; const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function startGps(){
  stopGps(); gps.err=null;
  if(!("geolocation" in navigator)){ gps.err="อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับ GPS"; return; }
  try{ if(document.featurePolicy&&!document.featurePolicy.allowsFeature("geolocation")){ gps.blocked=true; gps.err="หน้านี้เปิดอยู่ในกรอบของ Claude ซึ่งไม่ให้ใช้ตำแหน่ง"; return; } }catch(e){}
  try{
    gps.watch=navigator.geolocation.watchPosition(p=>{
      gps.pos={ll:[p.coords.latitude,p.coords.longitude],acc:p.coords.accuracy,spd:p.coords.speed,hd:p.coords.heading,t:Date.now()}; gps.err=null;
      placeMe(gps.pos.ll,"gps",gps.pos.acc,(p.coords.speed||0)>1?p.coords.heading:null); syncLoc();
      if(drive){ checkDrive(); renderDrive(); }
    },e=>{
      gps.err=e.code===1?"ยังไม่ได้อนุญาตให้ใช้ตำแหน่ง":e.code===3?"ยังจับสัญญาณ GPS ไม่ได้ (รอสักครู่)":"หาตำแหน่งไม่ได้ ลองออกไปที่โล่ง";
      if(e.code===1){ gps.blocked=true; stopGps(); }
      if(drive) renderDrive();
    },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }catch(e){ gps.err="เปิด GPS ไม่ได้"; }
}
function stopGps(){ try{ if(gps.watch!=null) navigator.geolocation.clearWatch(gps.watch); }catch(e){} gps.watch=null; }
function gpsLive(){ return gps.pos&&Date.now()-gps.pos.t<90e3; }
function startDrive(dayI,k){

  drive={day:dayI,k,it:snap,start:Date.now(),fired:{},minD:{},min:true}; store.set("drive",drive); lockScreen(); beep(); gps.blocked=false; startGps(); askNotif(); renderDrive(); runDrive(); showDriveMap();
}
function stopDrive(){ drive=null; store.set("drive",null); clearInterval(driveTimer); driveTimer=null; stopGps(); gps.pos=null; if(legLayer) legLayer.clearLayers(); if(meMk){ map.removeLayer(meMk); map.removeLayer(meAcc); meMk=null; meAcc=null; meShown=null; meKind=null; } syncLoc(); $("#driveRoot").innerHTML=""; setTimeout(()=>map&&map.invalidateSize(),50); document.body.classList.remove("driving"); try{ wake&&wake.release(); }catch(e){} wake=null; }
function driveItem(){ if(!drive) return null; if(drive.it) return drive.it; const d=DAYS[drive.day]; return d&&d.items[drive.k]; }
function driveEvents(it){ const ev=(it.sc||[]).map((s,i)=>({id:"s"+i,m:s.m,t:s.t,x:s.x,img:s.img,story:s.story,ll:s.ll,kind:"scenic"})); ev.push({id:"arr",m:Math.max(1,it.min-3),t:"ใกล้ถึง "+P[it.to][0],x:"ใกล้ถึงจุดหมายแล้ว",img:P[it.to][4],story:P[it.to][5],ll:[P[it.to][1],P[it.to][2]],kind:"arrive"}); return ev.sort((a,b)=>a.m-b.m); }
/* alert radius: ~2 min ahead at current speed (scenic), ~3 min for arrival; straight-line km */
function radius(e){ const v=gps.pos&&gps.pos.spd>0?gps.pos.spd*3.6:50; return Math.min(4,Math.max(e.kind==="arrive"?1.2:1,v*(e.kind==="arrive"?3:2)/60)); }
function checkDrive(){
  const it=driveItem(); if(!it) return;
  const evs=driveEvents(it); drive.minD=drive.minD||{};
  if(gpsLive()){
    evs.forEach(e=>{ if(!e.ll) return; const d=km(gps.pos.ll,e.ll); drive.minD[e.id]=Math.min(drive.minD[e.id]??99,d);
      if(!drive.fired[e.id]&&d<=radius(e)){ drive.fired[e.id]=1; store.set("drive",drive); showAlert(e,d); } });
  }else{
    const el=(Date.now()-drive.start)/1000;
    evs.forEach(e=>{ const due=e.m*60-120; if(el>=due && el<e.m*60+300 && !drive.fired[e.id]){ drive.fired[e.id]=1; store.set("drive",drive); showAlert(e); } });
  }
}
function gpsLine(){
  if(gpsLive()){ const p=gps.pos; const v=p.spd!=null&&p.spd>=0?Math.round(p.spd*3.6)+" กม./ชม. · ":""; return `<span class="gps on">● GPS</span> ${v}แม่นยำ ±${Math.round(p.acc)} ม.`; }

}
function renderDrive(){

    else { const left=e.m*60-el; const passed=left< -60; const due=!passed&&left<=120; cls=passed?"passed":due?"due":""; cd=passed?"ผ่านแล้ว":left<=0?"ตอนนี้":"อีก "+Math.ceil(left/60)+" น."; }

  $("#driveRoot").innerHTML=`<div class="drive wrap${drive.min?" min":""}" role="region" aria-label="โหมดขับรถ"><div class="d-top"><div style="min-width:0"><div class="d-t">→ ${esc(P[it.to][0])}</div><div class="d-s">${sub}</div></div><div class="d-el" aria-label="เวลาที่ขับมาแล้ว">${pad(Math.floor(el/60))}:${pad(el%60)}</div><button class="d-min" data-act="dmin" aria-label="${drive.min?"ขยาย":"ย่อ"}">${drive.min?"▴":"▾"}</button></div><div class="d-gps">${gpsLine()}</div><div class="d-gps">${notifLine()}</div>${drive.min?`<ul>${next.html}</ul>`:`<ul>${rows.map(r=>r.html).join("")}</ul><div class="d-actions">${live?"":`<button class="btn small" data-act="dshift" data-v="5">รถติด +5 นาที</button><button class="btn small" data-act="dshift" data-v="-5">เร็วกว่า −5</button>`}<button class="btn small" data-act="dmap">${I.map||""}ดูแผนที่</button>${aBtn(dirUrl(pointTarget(it.to)),"Google Maps",I.nav)}<button class="btn small primary" data-act="dstop">ถึงแล้ว / ปิด</button></div>`}</div>`;
  const h=$("#driveRoot").offsetHeight; if(map&&h!==lastDriveH){ lastDriveH=h; map.invalidateSize({pan:false}); }
}

function runDrive(){

    const it=driveItem(); if(!it){ stopDrive(); return; }

}

  if(a==="notif"){ askNotif(); return; }
  if(a==="tour"){ startTour(); return; }
  if(a==="dmap"){ showDriveMap(); return; }
  if(a==="popout"){ try{ window.open(location.href,"_blank"); }catch(e){} return; }
  if(a==="gpsretry"){ closeSheet(); gps.blocked=false; startGps(); if(drive) renderDrive(); return; }
  if(a==="dshift"){ if(drive){ drive.start+= (+b.dataset.v)*60e3; store.set("drive",drive); renderDrive(); } return; }
  if(a==="aclose"){ $("#alertRoot").innerHTML=""; return; }
});
document.addEventListener("change",ev=>{
  const c=ev.target.closest("[data-check]"); if(c){ const d=store.get("checks",{}); d[c.dataset.check]=c.checked; store.set("checks",d); c.closest(".check").classList.toggle("done",c.checked); }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="yen"||ev.target.id==="rate"){ if(ev.target.id==="rate"){ store.set("rate",parseFloat(ev.target.value)||RATE_DEFAULT); store.set("rateManual",true); } convUpdate(); } });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&drive) lockScreen(); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>restyleMap()); }catch(e){}
try{ new MutationObserver(()=>restyleMap()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]}); }catch(e){}

/* ---------- boot ---------- */
mapDay=-1;
renderDays(); renderPlan(); renderStories(); renderFood(); renderDrinks(); renderInfo(); tickClock(); setTimeout(()=>refreshWx(false),400); setTimeout(()=>refreshRate(false),1500);
setInterval(()=>{ tickClock(); },15000);
setInterval(()=>{ if(curTab==="plan"&&!$("#sheetRoot").innerHTML) renderPlan(); },120000);
showTab(curTab);
if(!store.get("tourDone",0)) setTimeout(startTour,500);
if(drive){ if(driveItem()&&Date.now()-drive.start<6*3600e3){ startGps(); renderDrive(); runDrive(); } else stopDrive(); }
const chip=$(`.day-chip[data-day="${curDay}"]`); chip&&chip.scrollIntoView({inline:"center",block:"nearest"});
})();
