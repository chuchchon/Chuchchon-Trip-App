<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF2F0">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>

<body>
<title>Hokkaido Momiji Drive</title>
<meta name="color-scheme" content="light">
<script>document.documentElement.setAttribute("data-theme","light")</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

}

  --accent:#E35A40; --accent-ink:#FFFFFF; --gold:#E2AE3E; --gold-soft:#3A2E12;
  --sea:#0D2128; --land:#1A2420; --land-line:#33433C; --lake:#16323D;
  --route-blue:#4A8BD6; --exp-green:#2FA36E; --ok:#3DBB72; --warn:#E39A2E;
  --d1:#5B95D6; --d2:#A77BD2; --d3:#E35A40; --d4:#2FAE90; --d5:#E89A2E; --d6:#D5609A; --d7:#8D9AA6;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#172019; --surface-2:#1C2622; --ink:#E5ECE8; --muted:#95A49D; --line:#2A3631;
  --accent:#E35A40; --accent-ink:#FFFFFF; --gold:#E2AE3E; --gold-soft:#3A2E12;
  --sea:#0D2128; --land:#1A2420; --land-line:#33433C; --lake:#16323D;

  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 10px;position:relative;z-index:20}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.02em}
.clock{font-family:var(--font-mono);font-size:13px;text-align:right;color:var(--muted);line-height:1.3;white-space:nowrap}
.clock b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.days::-webkit-scrollbar{display:none}
.day-chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px;cursor:pointer;text-align:left;min-width:58px}
.day-chip .dn{font-family:var(--font-display);font-weight:700;font-size:16px;display:block;line-height:1.1}
.day-chip .dd{font-size:12px;color:var(--muted);display:block;white-space:nowrap}
.day-chip[aria-pressed="true"]{border-color:var(--dc);background:var(--dc);color:#fff}
.day-chip[aria-pressed="true"] .dd{color:rgba(255,255,255,.85)}
.day-chip .today-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:4px;vertical-align:middle}

/* panels */
.panels{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 28px}
.panel[hidden]{display:none!important}
.panel.map-panel{padding:0;overflow:hidden}

/* bottom nav */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);position:relative;z-index:20}
.tab{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.day-chip:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* day header */
.day-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.day-num{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:.9;color:var(--dc)}
.day-title{margin:0;font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.25;text-wrap:balance}
.day-meta{font-size:14px;color:var(--muted);margin-top:2px}
.hotel-line{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.hotel-line b{font-weight:600}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.small{padding:4px 10px;font-size:13.5px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{display:grid;grid-template-columns:44px 18px minmax(0,1fr);gap:0 8px;padding-bottom:12px;position:relative}
.ti .tm{font-family:var(--font-mono);font-size:13.5px;font-weight:600;text-align:right;padding-top:3px;color:var(--ink);line-height:1.2}
.ti .tm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ti .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--dc);margin:5px 0 0 3px;position:relative;z-index:1}
.ti.k-drive .dot{border-style:dashed;background:var(--bg)}
.ti.k-bf .dot{border-color:var(--gold);background:var(--gold)}
.ti.k-opt{opacity:.92}
.ti.k-opt .dot{border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.ti.k-drive .card{background:transparent;border-style:dashed}
.ti.k-bf .card{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.ti.is-now .card{box-shadow:0 0 0 2px var(--dc)}
.c-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c-kind{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.c-name{font-weight:600;font-size:16.5px;line-height:1.35;margin:1px 0 2px}
.c-note{font-size:14.5px;color:var(--muted);margin:0}
.c-warn{font-size:14px;color:var(--warn);margin:4px 0 0}
.c-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.pill.new{color:var(--ok)} .pill.opt{color:var(--muted)} .pill.chg{color:var(--warn)}
.rt{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12.5px;color:#fff;background:var(--route-blue);border-radius:3px 3px 9px 9px;padding:1px 6px;min-width:30px;letter-spacing:.02em}
.rt.exp{background:var(--exp-green);border-radius:4px}
.rt.pref{background:#fff;color:var(--route-blue);border:1.5px solid var(--route-blue);border-radius:50%;min-width:24px;height:24px;padding:0}
.scenic-mini{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.scenic-mini li{font-size:13.5px;color:var(--muted);display:flex;gap:6px}
.scenic-mini li b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:12.5px;min-width:44px}

const CITY = [["ซัปโปโร","Sapporo"],["นิโจ","Sapporo"],["Jogai","Sapporo"],["โอตารุ","Otaru"],["โทยะ","Toyako"],["นิเซโกะ","Niseko"],["Takahashi","Niseko"],["สนามบิน","New Chitose Airport"],["ชิราโออิ","Shiraoi"],["โนโบริเบ็ตสึ","Noboribetsu"],["ชิโตเสะ","Chitose"],["โทมาโคไม","Tomakomai"],["มักการิ","Makkari"],["คุจจัง","Kutchan"],["Yuni","Yuni"]];
function cityOf(area){ for(const [k,v] of CITY) if(area.includes(k)) return v; return "Hokkaido"; }
function latinName(n){ return n.replace(/\(([^)]*[฀-๿][^)]*)\)/g,"").replace(/[฀-๿]+/g,"").replace(/\s+/g," ").trim(); }
function dirUrl({name,lat,lng,pid,q}){
  let u="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=";
  if(pid) u+=enc(q||name)+"&destination_place_id="+pid;
  else if(q) u+=enc(q);
  else u+=lat+","+lng;
  return u;
}
const imgUrl = q => "https://www.google.com/search?tbm=isch&q="+enc(q);
function pointTarget(pid){ const p=P[pid]; return {name:p[0],lat:p[1],lng:p[2],pid:p[3],q:p[6]||(p[3]?latinName(p[0])||p[4]:null)}; }
function foodTarget(f){ return {name:f[2],lat:f[4],lng:f[5],pid:f[6],q:(latinName(f[2])||f[2])+" "+cityOf(f[3])}; }
function dayRouteUrl(day){
  const pts=[]; let last=null;
  day.items.forEach(it=>{ if(!it.p||it.k==="opt"||it.k==="drive"||it.k==="train") return; if(it.p===last) return; last=it.p; pts.push(it.p); });
  if(pts.length<2) return null;
  const ll=id=>P[id][1]+","+P[id][2];
  const o=pts[0], d=pts[pts.length-1], w=pts.slice(1,-1).slice(0,8);
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin="+ll(o)+"&destination="+ll(d)+(w.length?"&waypoints="+w.map(ll).join("%7C"):"");
}

function nowItemIndex(day){
  const i=DAYS.indexOf(day); if(i!==todayIndex()) return -1;
  const j=jst(), now=j.h*60+j.mi; let best=-1;
  planItems(i).forEach(it=>{ if(it.k==="opt") return; const s=toMin(it.t); const e=it.e?toMin(it.e):s+(it.min||45); if(now>=s&&now<e) best=it._i; });
  return best;
}
function renderPlan(){
  const d=DAYS[curDay]; const el=$("#p-plan"); el.style.setProperty("--dc",`var(--d${d.n})`);

  h+=`<div class="row-actions">${ru?aBtn(ru,"เส้นทางทั้งวันใน Google Maps",I.nav,"go"):""}<button class="btn small" data-act="daymap">${I.map}ดูบนแผนที่</button><button class="btn small primary" data-act="addstop">＋ เพิ่มจุดแวะ / เลื่อนเวลา</button></div>`;
  h+=wxDayLine(curDay);
  if(edits[curDay]) h+=`<div class="note-box">วันนี้แก้แผนแล้ว เวลาคำนวณใหม่ (เวลาเดิมขีดฆ่าตัวเล็ก) <button class="linkbtn" data-act="cs-reset">รีเซ็ตกลับแผนเดิม</button></div>`;
  h+=`<ol class="tl">`;
  planItems(curDay).forEach(it=>{
    const k=it._i;
    const cls=`ti k-${it.k}${k===nowK?" is-now":""}`;
    const tm=`<div class="tm">${esc(it.t)}${it.e?`<small>${esc(it.e)}</small>`:""}${it._sh?`<s class="t0">${esc(it._t0)}</s>`:""}</div><div class="dot"></div>`;
    if(it.k==="custom"){ h+=customHtml(it,cls,tm)+insRow(k); return; }
    if(it.k==="drive"||it.k==="train"){
      const to=P[it.to][0];
      const sc=(it.sc||[]).map(s=>`<li><b>+${s.m} น.</b><span>${esc(s.t)}</span></li>`).join("");
      const roads=(it.rd||[]).map(roadBadge).join(" ");
      h+=`<li class="${cls}${it.syn?" syn":""}">${tm}<div class="card"><div class="c-top"><span class="c-kind">${it.k==="train"?"🚆 รถไฟ":"🚗 ขับรถ"} · ${it.min} นาที</span>${roads}${wxChip(it.to,d.date,fmtMin(toMin(it.t)+(it.min||0)))}</div><div class="c-name">→ ${esc(to)}</div>${it.x?`<p class="c-note">${esc(it.x)}</p>`:""}${sc?`<ul class="scenic-mini">${sc}</ul>`:""}<div class="c-actions">${it.k==="drive"?`<button class="btn small primary" data-act="drive" data-k="${esc(k)}">${I.play}โหมดขับรถ</button>`:""}${aBtn(dirUrl(pointTarget(it.to)),"นำทาง",I.nav)}</div></div></li>`;

    if(it.k!=="opt") h+=insRow(k);
  });
  h+=`</ol>`;
  if(curDay===2) h+=`<div class="note-box">วันนี้ขับขึ้นเขาสูง ถ้าเช้ามีน้ำแข็งบนถนน ขับช้าและเว้นระยะ · พระอาทิตย์ตกราว 16:50 ควรถึงโจซังเคก่อนมืด</div>`;
  el.innerHTML=h; hydratePhotos(el);
}

/* ---------- live location on map ---------- */
let meMk=null, meAcc=null, meShown=null, meAnim=null, meKind=null, meHd=null, follow=true, legLayer=null, tilesOk=false, lastDriveH=0;
const FRAMED=(()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
const CAN_POP=FRAMED&&/^https?:$/.test(location.protocol);
function meIcon(kind,hd){ return L.divIcon({className:"",iconSize:[28,28],iconAnchor:[14,14],html:`<div class="me ${kind}">${hd!=null&&kind==="gps"?`<i style="transform:rotate(${Math.round(hd)}deg)"></i>`:""}<b></b></div>`}); }
function placeMe(ll,kind,acc,hd){
  if(!map||!ll) return;
  hd=(hd!=null&&!isNaN(hd))?Math.round(hd/10)*10:null;
  if(!meMk){ meAcc=L.circle(ll,{radius:0,interactive:false,stroke:false,fillColor:"#2F80ED",fillOpacity:.14}).addTo(map); meMk=L.marker(ll,{icon:meIcon(kind,hd),zIndexOffset:6000,interactive:false,keyboard:false}).addTo(map); meShown=ll; meKind=kind; meHd=hd; }
  if(kind!==meKind||hd!==meHd){ meMk.setIcon(meIcon(kind,hd)); meKind=kind; meHd=hd; }
  meAcc.setRadius(kind==="gps"?Math.min(acc||0,500):0);
  const from=meShown||ll, t0=performance.now(), D=950; cancelAnimationFrame(meAnim);
  const step=now=>{ const k=Math.min(1,(now-t0)/D); const p=[from[0]+(ll[0]-from[0])*k,from[1]+(ll[1]-from[1])*k]; meMk.setLatLng(p); meAcc.setLatLng(p); meShown=p; if(k<1) meAnim=requestAnimationFrame(step); };
  meAnim=requestAnimationFrame(step);
  if(follow&&curTab==="map"){ if(map.getZoom()<(tilesOk?11:9)) map.setView(ll,tilesOk?14:10,{animate:false}); else map.panTo(ll,{animate:true,duration:.95,easeLinearity:1,noMoveStart:true}); }
}

function applyDraft(ed,dr){

    const i=dr.atStart?-1:ed.list.findIndex(x=>x.key===dr.afterKey); ed.list.splice(i<0&&!dr.atStart?ed.list.length:i+1,0,n); }
  else { const n=ed.list.find(x=>x.key===dr.key); if(!n) return; n.dur=dr.dur; n.at=dr.at||""; if(n.kind==="custom"){ n.name=dr.name||n.name; n.lat=dr.lat; n.lng=dr.lng; n.note=dr.note; regCustom(n); } if(dr.promote!=null) n.promote=dr.promote; }

async function geoSearch(q){
  const bias=gps.pos?gps.pos.ll:(()=>{ const r=DAYS[curDay].route; return r[Math.floor(r.length/2)]; })();
  const m=q.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)/); if(m) return [{name:"พิกัดที่ใส่",sub:q,lat:+m[1],lng:+m[2]}];
  try{ const r=await fetch(`https://photon.komoot.io/api/?q=${enc(q)}&lat=${bias[0]}&lon=${bias[1]}&limit=8&bbox=${HKD_BBOX}`); const j=await r.json();
    const out=(j.features||[]).map(f=>{ const p=f.properties||{}; return {name:p.name||p.street||q,sub:[p.city||p.town||p.village||p.county,p.state].filter(Boolean).join(", "),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}; });
    if(out.length) return out; }catch(e){}
  try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${enc(q)}&countrycodes=jp&viewbox=139.3,45.6,146.0,41.3&bounded=1&limit=8&accept-language=ja,en`); const j=await r.json();
    return j.map(x=>({name:(x.name||x.display_name.split(",")[0]),sub:x.display_name.split(",").slice(1,3).join(","),lat:+x.lat,lng:+x.lon})); }catch(e){ return null; }
}

/* ---------- photos (Wikimedia Commons, loaded on the phone) ---------- */
const photoCache=store.get("photos",{});
const photoReq={};
function cleanQ(q){ return String(q||"").replace(/紅葉|夜景|夕景|眺望|景色/g,"").replace(/\s+/g," ").trim(); }
function commonsPhotos(q,n){
  q=cleanQ(q); const key=q+"|"+n;
  if(photoCache[key]) return Promise.resolve(photoCache[key]);
  if(photoReq[key]) return photoReq[key];
  const url=`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=${n+3}&gsrsearch=${enc(q+" filetype:bitmap")}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640`;
  photoReq[key]=fetch(url).then(r=>r.json()).then(j=>{
    const pages=Object.values((j.query||{}).pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
    const out=pages.map(p=>{ const ii=(p.imageinfo||[])[0]||{}; const md=ii.extmetadata||{}; return {src:ii.thumburl,page:ii.descriptionurl,by:((md.Artist||{}).value||"").replace(/<[^>]+>/g,"").slice(0,60),lic:((md.LicenseShortName||{}).value||"")}; }).filter(x=>x.src&&!/\.(svg|pdf|tif)/i.test(x.page||"")).slice(0,n);
    if(!out.length&&q.includes(" ")&&!q.endsWith("~")){ const q2=q.split(" ").slice(0,-1).join(" "); return commonsPhotos(q2,n).then(r=>{ photoCache[key]=r||[]; return r; }); }
    photoCache[key]=out; try{ const ks=Object.keys(photoCache); if(ks.length>200) delete photoCache[ks[0]]; store.set("photos",photoCache); }catch(e){} return out;
  }).catch(()=>null);
  return photoReq[key];
}
function stripHtml(q,n,cls){ return `<div class="ph-strip ${cls||""}" data-q="${esc(q)}" data-n="${n||5}"><div class="ph-skel"></div><div class="ph-skel"></div><div class="ph-skel"></div></div>`; }
let phObs=null;
function hydratePhotos(root){
  const els=$$(".ph-strip:not([data-done])",root||document);
  const go=async el=>{ el.dataset.done=1; const list=await commonsPhotos(el.dataset.q,+el.dataset.n||5);
    if(!list||!list.length){ el.innerHTML=`<a class="ph-none" href="${esc(imgUrl(el.dataset.q))}" target="_blank" rel="noopener">${I.img} ${list?"ยังไม่มีภาพตัวอย่าง":"โหลดภาพไม่ได้"} · ดูรูปใน Google</a>`; return; }
    el.innerHTML=list.map((p,i)=>`<button class="ph" data-ph="${esc(el.dataset.q)}|${el.dataset.n}" data-pi="${i}"><img src="${esc(p.src)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`).join("")+`<a class="ph more" href="${esc(imgUrl(el.dataset.q))}" target="_blank" rel="noopener">${I.img}<span>ดูเพิ่ม</span></a>`;
  };
  if(!("IntersectionObserver" in window)){ els.forEach(go); return; }
  if(!phObs) phObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ phObs.unobserve(e.target); go(e.target); } }),{rootMargin:"300px"});
  els.forEach(el=>phObs.observe(el));
}
function openLightbox(q,n,i){
  const list=photoCache[cleanQ(q)+"|"+n]; if(!list) return; let k=i;
  const draw=()=>{ const p=list[k]; $("#lbRoot").innerHTML=`<div class="lb" data-lb="close"><img src="${esc(p.src)}" alt=""><div class="lb-bar"><button class="btn small" data-lb="prev" ${k===0?"disabled":""}>‹</button><span class="tiny">${k+1}/${list.length} · ${esc(p.by||"Wikimedia Commons")} ${esc(p.lic||"")}</span><a class="btn small" href="${esc(p.page)}" target="_blank" rel="noopener">ที่มา</a><button class="btn small" data-lb="next" ${k===list.length-1?"disabled":""}>›</button></div></div>`; };
  draw();
  $("#lbRoot").onclick=ev=>{ const b=ev.target.closest("[data-lb]"); if(!b) return; const a=b.dataset.lb; if(a==="close"&&ev.target!==b) return; if(a==="next"&&k<list.length-1){k++;draw();} else if(a==="prev"&&k>0){k--;draw();} else if(a==="close") $("#lbRoot").innerHTML=""; };
}
document.addEventListener("click",ev=>{ const b=ev.target.closest("[data-ph]"); if(!b) return; ev.stopPropagation(); const [q,n]=b.dataset.ph.split("|"); openLightbox(q,+n,+b.dataset.pi); },true);

/* ---------- weather (Open-Meteo, refreshed on the phone) ---------- */
let wx=store.get("wx",null), wxBusy=false;
const WX_STALE=30*60e3;
function wxPoints(){
  const m={};
  const add=(lat,lng)=>{ const k=(+lat).toFixed(2)+","+(+lng).toFixed(2); m[k]=1; };
  DAYS.forEach((d,di)=>planItems(di).forEach(it=>{ const k=it.k==="drive"||it.k==="train"?it.to:it.p; if(k&&P[k]) add(P[k][1],P[k][2]); }));
  return Object.keys(m);
}
async function refreshWx(force){
  if(wxBusy) return; if(!force&&wx&&Date.now()-wx.at<WX_STALE) return;
  const pts=wxPoints(); if(!pts.length) return; wxBusy=true;
  try{
    const lat=pts.map(p=>p.split(",")[0]).join(","), lon=pts.map(p=>p.split(",")[1]).join(",");
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&past_days=1&forecast_days=7`);
    const j=await r.json(); const arr=Array.isArray(j)?j:[j]; const data={};
    arr.forEach((loc,i)=>{ if(loc&&loc.hourly) data[pts[i]]={time:loc.hourly.time,t:loc.hourly.temperature_2m,pp:loc.hourly.precipitation_probability,pr:loc.hourly.precipitation,wc:loc.hourly.weather_code,ws:loc.hourly.wind_speed_10m}; });

  pushNotif((e.kind==="arrive"?"🏁 ":"🍁 ")+e.t,e.x||"",e.id);
  const head=e.kind==="arrive"?"ใกล้ถึงแล้ว":d!=null?`จุดวิวข้างหน้า · อีกราว ${d<1?"<1":d.toFixed(1)} กม.`:"จุดวิวข้างหน้า · อีกราว 2 นาที";
  $("#alertRoot").innerHTML=`<div class="alert" role="alert"><div class="a-k">${head}</div><div class="a-t">${esc(e.t)}</div><p class="a-x">${esc(e.x)}</p><div class="a-act">${e.img?aBtn(imgUrl(e.img),"ดูรูป",I.img):""}${e.story?`<button class="btn small" data-act="story" data-id="${e.story}">${I.book}เรื่องน่ารู้</button>`:""}<button class="btn small" data-act="aclose">ปิด</button></div></div>`;
  clearTimeout(alertT); alertT=setTimeout(()=>{$("#alertRoot").innerHTML="";},30000);
}

/* ---------- tabs ---------- */
function showTab(t){
  curTab=t; store.set("tab",t);
  $$(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  ["plan","map","stories","food","drinks","info"].forEach(k=>{ $("#p-"+k).hidden = k!==t; }); if(t!=="map"&&pickMode){ endPick(); }
  if(t==="map"){ if(!map){ initMap(); } else { setTimeout(()=>map.invalidateSize(),30); } }
}
function selectDay(i){ curDay=i; store.set("day",i); renderDays(); renderPlan(); if(map&&curTab!=="map"){ mapDay=i; } }

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act],[data-day],[data-tab],[data-mday],[data-flag],[data-cat],[data-farea],[data-fcat],[data-fplan],[data-copy]");
  if(!b) return;
  if(b.dataset.day!=null){ selectDay(+b.dataset.day); $("#p-plan").scrollTop=0; return; }
  if(b.dataset.tab){ showTab(b.dataset.tab); return; }
  if(b.dataset.mday!=null){ mapDay=+b.dataset.mday; renderMapChips(); drawMap(true); return; }
  if(b.dataset.flag){ mapFlags[b.dataset.flag]=!mapFlags[b.dataset.flag]; store.set("mapFlags",mapFlags); renderMapChips(); drawMap(false); return; }
  if(b.dataset.cat){ const c=+b.dataset.cat; foodCats.has(c)?foodCats.delete(c):foodCats.add(c); renderMapChips(); drawMap(false); return; }
  if(b.dataset.farea){ foodArea=b.dataset.farea; renderFood(); return; }
  if(b.dataset.fcat!=null){ foodCat=+b.dataset.fcat; renderFood(); return; }
  if(b.dataset.fplan){ foodPlanOnly=!foodPlanOnly; renderFood(); return; }
  if(b.dataset.copy!=null){ const txt=b.dataset.copy; const done=()=>{ const o=b.innerHTML; b.textContent="คัดลอกแล้ว"; setTimeout(()=>b.innerHTML=o,1400); }; try{ navigator.clipboard.writeText(txt).then(done,()=>{}); }catch(e){} return; }
  const a=b.dataset.act;
  if(a==="close"){ closeSheet(); return; }
  if(a==="story"){ openSheet(storyHtml(b.dataset.id)); return; }
  if(a==="food"){ openSheet(foodHtml(b.dataset.id)); return; }
  if(a==="booking"){ openSheet(bookingHtml(b.dataset.id)); return; }
  if(a==="foodmap"){ closeSheet(); const f=FOOD.find(x=>x[0]===+b.dataset.id); if(!f) return; if(!INPLAN[f[0]]){ mapFlags.all=true; foodCats.add(f[1]); } else mapFlags.plan=true; store.set("mapFlags",mapFlags); showTab("map"); setTimeout(()=>{ renderMapChips(); drawMap(false); map.setView([f[4],f[5]],16); layers.food.eachLayer(m=>{ const ll=m.getLatLng(); if(Math.abs(ll.lat-f[4])<1e-6&&Math.abs(ll.lng-f[5])<1e-6) m.openPopup(); }); },80); return; }
  if(a==="daymap"){ mapDay=curDay; showTab("map"); setTimeout(()=>{ renderMapChips(); drawMap(true); },60); return; }
  if(a==="drive"){ startDrive(curDay,b.dataset.k); return; }
  if(a==="dstop"){ stopDrive(); return; }
  if(a==="dmin"){ if(drive){ drive.min=!drive.min; store.set("drive",drive); renderDrive(); } return; }
  if(a==="gpshelp"){ openSheet(gpsHelp()); return; }
  if(a==="notif"){ askNotif(); return; }
  if(a==="tour"){ startTour(); return; }
  if(a==="dmap"){ showDriveMap(); return; }
  if(a==="popout"){ try{ window.open(location.href,"_blank"); }catch(e){} return; }
  if(a==="gpsretry"){ closeSheet(); gps.blocked=false; startGps(); if(drive) renderDrive(); return; }
  if(a==="dshift"){ if(drive){ drive.start+= (+b.dataset.v)*60e3; store.set("drive",drive); renderDrive(); } return; }
  if(a==="aclose"){ $("#alertRoot").innerHTML=""; return; }
});
document.addEventListener("change",ev=>{
  const c=ev.target.closest("[data-check]"); if(c){ const d=store.get("checks",{}); d[c.dataset.check]=c.checked; store.set("checks",d); c.closest(".check").classList.toggle("done",c.checked); }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="yen"||ev.target.id==="rate"){ if(ev.target.id==="rate") store.set("rate",parseFloat(ev.target.value)||RATE_DEFAULT); convUpdate(); } });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&drive) lockScreen(); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>restyleMap()); }catch(e){}
try{ new MutationObserver(()=>restyleMap()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]}); }catch(e){}

/* ---------- boot ---------- */
mapDay=-1;
renderDays(); renderPlan(); renderStories(); renderFood(); renderDrinks(); renderInfo(); tickClock(); setTimeout(()=>refreshWx(false),400);
setInterval(()=>{ tickClock(); },15000);
setInterval(()=>{ if(curTab==="plan"&&!$("#sheetRoot").innerHTML) renderPlan(); },120000);
showTab(curTab);
if(!store.get("tourDone",0)) setTimeout(startTour,500);
if(drive){ if(driveItem()&&Date.now()-drive.start<6*3600e3){ startGps(); renderDrive(); runDrive(); } else stopDrive(); }
const chip=$(`.day-chip[data-day="${curDay}"]`); chip&&chip.scrollIntoView({inline:"center",block:"nearest"});
})();

</script>
