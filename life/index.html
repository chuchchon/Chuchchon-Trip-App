<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Moment</title>
<meta name="theme-color" content="#F7F7F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one quiet photo column with a thin year rail on the right; sound lives in a small bar at the bottom; the Book opens over everything as its own paper world. */
:root{
  --paper:#F7F7F5; --surface:#FFFFFF; --ink:#1D1F24; --muted:#6B6F78; --line:#E3E3E0;
  --accent:#B8445F; --accent-soft:#F6E4E8; --chip:#ECECE8;
  --page:#FBF8F1; --page-ink:#2A2622; --page-muted:#857B70; --desk:#2B2724;
  --font-display:"Noto Serif Thai","Noto Serif",Georgia,serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#141518;--surface:#1C1D21;--ink:#ECECEE;--muted:#A0A3AB;--line:#2D2F35;--accent:#E07A93;--accent-soft:#3A2329;--chip:#26282D;--desk:#0E0D0C;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#141518;--surface:#1C1D21;--ink:#ECECEE;--muted:#A0A3AB;--line:#2D2F35;--accent:#E07A93;--accent-soft:#3A2329;--chip:#26282D;--desk:#0E0D0C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.3;text-wrap:balance}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.15rem;margin-right:auto;white-space:nowrap}
.bar .btn{padding:7px 11px;font-size:.86rem}
.btn{padding:7px 14px;border-radius:99px;background:var(--chip);font-weight:500;font-size:.9rem;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--chip);font-size:.86rem;font-weight:500}
.chip.on{background:var(--ink);color:var(--paper)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* timeline */
.col{max-width:620px;margin:0 auto;padding:8px 46px 0 16px;display:flex;flex-direction:column;gap:36px}
.note{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.note span{flex:1;min-width:200px}
.group{display:flex;flex-direction:column;gap:18px;scroll-margin-top:120px;padding-top:18px}
.ghead{display:flex;flex-direction:column;gap:4px}
.ghead h2{font-size:1.45rem}
.gmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.gmeta .snd{color:var(--accent);font-weight:600}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.84rem}
.m{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;scroll-margin-top:130px}
.ph{position:relative;border-radius:18px;overflow:hidden;background:var(--chip);width:100%}
.ph img,.ph .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .date{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);color:#1D1F24;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px}
.ph .count{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px}
.m h3{font-size:1.12rem}
.mmeta{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.avs{display:flex}
.avs .dot{width:14px;height:14px;border:2px solid var(--paper);margin-left:-5px}
.avs .dot:first-child{margin-left:0}
.ph img:not([src]){visibility:hidden}
.ph.wait::after{content:"เข้าสู่ระบบ Google เพื่อดูรูป";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.84rem}
.steps{margin:0;padding-left:1.2em;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.steps code{font-size:.8rem;word-break:break-all;background:var(--chip);padding:1px 5px;border-radius:5px}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
.loading{text-align:center;color:var(--muted);padding:80px 0}

/* year rail */
.rail{position:fixed;top:132px;bottom:110px;right:max(6px,calc(50% - 318px));width:34px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.rail button{position:relative;background:var(--paper);font-size:.72rem;color:var(--muted);padding:3px 0;font-variant-numeric:tabular-nums}
.rail button.cur{color:var(--accent);font-weight:700}
.rail button.cur::before{content:"";position:absolute;left:50%;top:-9px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* mini player */
.player{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(588px,calc(100% - 24px));background:#1D1F24;color:#fff;border-radius:18px;padding:9px 10px 9px 12px;display:flex;align-items:center;gap:10px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pp{width:38px;height:38px;border-radius:50%;background:#fff;color:#1D1F24;display:grid;place-items:center;font-size:.8rem;flex:none}
.player .txt{flex:1;min-width:0;text-align:left}
.player .t1{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .t2{font-size:.76rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .btn{background:rgba(255,255,255,.14);color:#fff}
.bars{display:flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;background:var(--accent);border-radius:1px;height:4px}
.playing .bars i{animation:eq .9s ease-in-out infinite alternate}
.playing .bars i:nth-child(2){animation-delay:.2s}.playing .bars i:nth-child(3){animation-delay:.45s}
@keyframes eq{from{height:3px}to{height:12px}}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;display:none}
.ov.open{display:flex}
.scrim{background:rgba(15,15,18,.5);align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:1.25rem}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input{flex:1;min-width:120px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:.88rem}
.prev{display:flex;gap:8px;flex-wrap:wrap}
.prev .th{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--chip)}
.prev .th img{width:100%;height:100%;object-fit:cover}
.prev .th button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;line-height:1}
.pick{width:76px;height:76px;border-radius:12px;border:1.5px dashed var(--muted);display:grid;place-items:center;font-size:.78rem;color:var(--muted);text-align:center;cursor:pointer;position:relative}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.msg{font-size:.86rem;color:var(--accent);min-height:1.2em}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .st{font-weight:600;font-size:.94rem}
.srow .ss{font-size:.78rem;color:var(--muted)}
.srow select{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 10px;font-size:.86rem;max-width:150px}
.srow.cur .st{color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}

/* detail */
.detail{background:#0D0D0F;color:#fff;flex-direction:column}
.dtop{display:flex;justify-content:space-between;padding:12px 14px;gap:8px}
.dtop .btn{background:rgba(255,255,255,.14);color:#fff}
.dstage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.dstage img,.dstage .fill{max-width:100%;max-height:100%;object-fit:contain}
.dstage .fill{width:min(100%,520px);height:100%;border-radius:12px}
.dnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:1.1rem}
.dnav.l{left:10px}.dnav.r{right:10px}
.dinfo{padding:14px 18px 22px;display:flex;flex-direction:column;gap:6px;max-width:640px;width:100%;margin:0 auto;max-height:38%;overflow-y:auto}
.dinfo .d{font-size:.84rem;opacity:.75}
.dinfo h2{font-size:1.4rem}
.dinfo p{margin:0;opacity:.9;white-space:pre-wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border-radius:99px;padding:2px 11px;font-size:.8rem}

/* book */
.bookov{background:var(--desk);flex-direction:column;color:#EDE6DA}
.btop{display:flex;align-items:center;gap:8px;padding:12px 14px}
.btop .ttl{font-family:var(--font-display);font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookov .btn{background:rgba(255,255,255,.12);color:#EDE6DA}
.bookov .btn.on{background:#EDE6DA;color:#2A2622}
.bwrap{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:0 16px;touch-action:pan-y}
.book{position:relative;perspective:2600px;transition:transform .8s cubic-bezier(.45,.05,.2,1);color:var(--page-ink)}
.leaf{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.2,1)}
.book.single .leaf{width:100%}
.leaf.flipped{transform:rotateY(-180deg)}
.book.single .leaf.flipped{visibility:hidden;transition:transform .85s cubic-bezier(.45,.05,.2,1),visibility 0s .8s}
.book.instant,.book.instant .leaf{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--page);box-shadow:inset 14px 0 22px -16px rgba(60,40,20,.45),0 6px 24px rgba(0,0,0,.35);border-radius:2px 8px 8px 2px}
.face.back{transform:rotateY(180deg);box-shadow:inset -14px 0 22px -16px rgba(60,40,20,.45),0 6px 24px rgba(0,0,0,.35);border-radius:8px 2px 2px 8px}
.pg{position:absolute;inset:0;padding:8% 9%;display:flex;flex-direction:column;gap:.7em;font-size:1em;line-height:1.55}
.pg .no{position:absolute;bottom:3.5%;left:0;right:0;text-align:center;font-size:.62em;color:var(--page-muted);font-variant-numeric:tabular-nums}
.pg h2{font-size:1.75em}.pg h3{font-size:1.3em}
.pg .eb{font-size:.68em;font-weight:600;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.pg .mut{color:var(--page-muted);font-size:.78em}
.pg p{margin:0;font-size:.86em;white-space:pre-wrap;overflow:hidden}
.pg.cover{background:#7E2A40;color:#F6E7DA;justify-content:flex-end;padding:10%}
.pg.cover .cph{position:absolute;inset:0;opacity:.55}
.pg.cover .cph img,.pg.cover .cph .fill{width:100%;height:100%;object-fit:cover}
.pg.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,15,28,.2),rgba(60,15,28,.9))}
.pg.cover>*{position:relative;z-index:1}
.pg.cover h2{font-size:2.3em}
.pg.cover .eb{color:#F3C9B5}
.pg.chap{background:#F3EBDD;justify-content:center}
.pg.chap h2{font-size:2em}
.pg.photo{padding:7% 7% 13%}
.pg.photo .frame{flex:1;min-height:0;position:relative;background:#E9E2D4;overflow:hidden;border-radius:2px}
.pg.photo .frame img,.pg.photo .frame .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg.photo .cap{position:absolute;left:7%;right:7%;bottom:5.5%;font-family:var(--font-display);font-size:.8em;display:flex;justify-content:space-between;gap:.6em;color:var(--page-muted)}
.pg.photo .more{position:absolute;right:.6em;bottom:.6em;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:.15em .8em;font-size:.68em;font-weight:600}
.tags{display:flex;gap:.4em;flex-wrap:wrap}
.tag{font-size:.68em;border:1px solid #CFC5B4;border-radius:99px;padding:.1em .8em;display:flex;gap:.4em;align-items:center}
.toc{display:flex;flex-direction:column;gap:.15em;overflow:hidden}
.toc button{display:flex;justify-content:space-between;gap:1em;text-align:left;padding:.35em 0;border-bottom:1px dotted #CFC5B4;font-size:.84em;color:inherit}
.toc button span:last-child{color:var(--page-muted);font-variant-numeric:tabular-nums;flex:none}
.pg .cta{align-self:flex-start;background:var(--page-ink);color:var(--page);border-radius:99px;padding:.4em 1.2em;font-size:.8em;font-weight:600}
.bbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px 18px}
.bbar .pos{font-size:.84rem;opacity:.8;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.bbar .nav{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#EDE6DA;font-size:1.2rem}
.bbar .nav:disabled{opacity:.3}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:99px;font-size:.88rem;z-index:90;display:none;max-width:90%;text-align:center}
.toast.show{display:block}

/* sample "photos" */
.g1{background:radial-gradient(circle at 70% 25%,#FFD9A0 0 9%,transparent 10%),linear-gradient(165deg,#F2B067,#D2552F 50%,#6B2318)}
.g2{background:radial-gradient(circle at 30% 28%,#FFF4D6 0 6%,transparent 7%),linear-gradient(180deg,#F6D2B3,#9CC5DE 42%,#3F7FA6 43%,#244E6C)}
.g3{background:radial-gradient(circle at 75% 35%,#FFE7BF 0 12%,transparent 13%),linear-gradient(150deg,#EED7B4,#C49B72 60%,#6D4D33)}
.g4{background:radial-gradient(circle at 50% 60%,#FFE1C2 0 8%,transparent 9%),linear-gradient(175deg,#3E3A6B,#B47A92 55%,#F3C29E)}
.g5{background:linear-gradient(180deg,#DCE6EE,#B9C8D6 55%,#F4F6F8 56%,#E6EBF0)}
.g6{background:radial-gradient(circle at 20% 20%,#FFE9A8 0 3%,transparent 4%),radial-gradient(circle at 60% 30%,#FFD1E0 0 4%,transparent 5%),radial-gradient(circle at 80% 15%,#C9E6FF 0 3%,transparent 4%),linear-gradient(180deg,#1B2140,#3A2F5E 70%,#6B4A6E)}
.g7{background:linear-gradient(180deg,#8FA3AD,#B8C4C9 45%,#5F7F8C 46%,#3E5964)}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition:none}.playing .bars i{animation:none}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="bar">
    <span class="logo">Life Moment</span>
    <button class="btn" data-act="drive" id="drvBtn" aria-label="Google Drive">☁</button>
    <button class="btn" data-act="book">หนังสือ</button>
    <button class="btn primary" data-act="add" id="addBtn">＋ เพิ่ม</button>
  </div>
  <div class="chips" id="chips"></div>
</div></header>

<main class="col" id="col"><div class="loading">กำลังเปิดความทรงจำ…</div></main>
<nav class="rail" id="rail" aria-label="ปี"></nav>

<div class="player" id="player">
  <button class="pp" data-act="toggle" id="pp" aria-label="เล่นหรือหยุดเสียง">▶</button>
  <button class="txt" data-act="sound">
    <div class="t1" id="pl1">แตะ ▶ เพื่อเริ่มฟัง</div>
    <div class="t2" id="pl2">เสียงจะเปลี่ยนตามบทที่เลื่อนผ่าน</div>
  </button>
  <span class="bars"><i></i><i></i><i></i></span>
  <button class="btn" data-act="sound">รายการเสียง</button>
</div>

<!-- moment editor -->
<div class="ov scrim" id="ovEdit"><div class="sheet" role="dialog" aria-labelledby="edTitle">
  <div class="sheet-head"><h2 id="edTitle">เพิ่ม Moment</h2><button class="btn" data-act="close">ปิด</button></div>
  <div class="field"><span class="lbl">รูป</span>
    <div class="prev" id="edPrev"></div></div>
  <div class="field"><label for="edName">ชื่อ moment</label><input id="edName" placeholder="เช่น ใบไม้แดงที่โจซังเค"></div>
  <div class="row">
    <div class="field"><label for="edDate">วันที่</label><input id="edDate" type="date"></div>
    <div class="field"><label for="edPlace">สถานที่</label><input id="edPlace" placeholder="ไม่ใส่ก็ได้"></div>
  </div>
  <div class="field"><label for="edStory">เรื่องสั้นๆ ของวันนั้น</label><textarea id="edStory"></textarea></div>
  <div class="field"><span class="lbl">อยู่กับใคร</span>
    <div class="inline" id="edPeople"></div>
    <div class="inline"><input id="edNewPerson" placeholder="เพิ่มคน เช่น ภรรยา, แม่" aria-label="ชื่อคนใหม่"><button class="btn" data-act="addPerson">เพิ่ม</button></div></div>
  <div class="row">
    <div class="field"><label for="edChapter">บท</label><select id="edChapter"></select></div>
    <div class="field" id="edNewChWrap" hidden><label for="edNewCh">ชื่อบทใหม่</label><input id="edNewCh" placeholder="เช่น ปีแรกที่แต่งงาน"></div>
  </div>
  <div class="msg" id="edMsg"></div>
  <div class="inline"><button class="btn accent" data-act="saveMoment" id="edSave">บันทึก</button><button class="btn danger" data-act="delMoment" id="edDel" hidden>ลบ moment นี้</button></div>
</div></div>

<!-- chapter editor -->
<div class="ov scrim" id="ovChap"><div class="sheet" role="dialog" aria-labelledby="chTitleH">
  <div class="sheet-head"><h2 id="chTitleH">แก้ไขบท</h2><button class="btn" data-act="close">ปิด</button></div>
  <div class="field"><label for="chName">ชื่อบท</label><input id="chName"></div>
  <div class="row">
    <div class="field"><label for="chStart">เริ่ม</label><input id="chStart" type="date"></div>
    <div class="field"><label for="chEnd">ถึง</label><input id="chEnd" type="date"></div>
  </div>
  <div class="field"><label for="chSound">เสียงประจำบท</label><select id="chSound"></select></div>
  <div class="msg" id="chMsg"></div>
  <div class="inline"><button class="btn accent" data-act="saveChapter">บันทึก</button><button class="btn danger" data-act="delChapter" id="chDel">ลบบทนี้ (moment ยังอยู่)</button></div>
</div></div>

<!-- sound list -->
<div class="ov scrim" id="ovSound"><div class="sheet" role="dialog" aria-labelledby="sdH">
  <div class="sheet-head"><h2 id="sdH">เสียงตามไทม์ไลน์</h2><button class="btn" data-act="close">ปิด</button></div>

<script>

const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};

/* ---------- sounds ---------- */
const MOODS={
  warm:{name:"อบอุ่น",chord:[130.81,164.81,196,246.94],scale:[261.63,293.66,329.63,392,440],wave:"triangle",cut:900,step:900,density:.45},
  bright:{name:"สดใส",chord:[146.83,185,220,329.63],scale:[293.66,329.63,369.99,440,493.88,587.33],wave:"triangle",cut:1600,step:450,density:.6},
  nostalgic:{name:"คิดถึง",chord:[110,164.81,246.94,261.63],scale:[220,261.63,293.66,329.63,392],wave:"sine",cut:700,step:1100,density:.45},
  calm:{name:"สงบ",chord:[87.31,130.81,220,329.63],scale:[349.23,392,440,523.25,587.33],wave:"sine",cut:600,step:1600,density:.35},
  celebrate:{name:"เฉลิมฉลอง",chord:[196,246.94,293.66],scale:[392,440,493.88,587.33,659.25,783.99],wave:"triangle",cut:2200,step:300,density:.65},
  rain:{name:"ฝนพรำ",chord:[146.83,174.61,220],scale:[293.66,349.23,392,440,523.25],wave:"sine",cut:800,step:1300,density:.35,noise:true},
  none:{name:"เงียบ"}

const allFileSounds=()=>S.sounds;
function soundName(k){if(!k)return MOODS.calm.name;if(MOODS[k])return MOODS[k].name;const f=allFileSounds().find(s=>"f:"+s.id===k);return f?f.title:"เสียงที่หายไป";}
function soundOptions(sel){return Object.entries(MOODS).map(([k,m])=>`<option value="${k}"${k===sel?" selected":""}>${m.name}</option>`).join("")+allFileSounds().map(s=>`<option value="f:${s.id}"${"f:"+s.id===sel?" selected":""}>♪ ${esc(s.title)}</option>`).join("");}

const AE={ctx:null,on:false,vol:.7,voice:null,key:null,want:null,label:"",FADE:2.5};
function ensureCtx(){if(!AE.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AE.ctx=new C();AE.master=AE.ctx.createGain();AE.master.gain.value=AE.vol;AE.master.connect(AE.ctx.destination);}if(AE.ctx.state==="suspended")AE.ctx.resume().catch(()=>{});return true;}
function synthVoice(m){
  const c=AE.ctx,out=c.createGain();out.gain.value=0;out.connect(AE.master);
  const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=m.cut;f.connect(out);
  const nodes=[];
  m.chord.forEach((hz,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=m.wave;o.frequency.value=hz;o.detune.value=(i%2?5:-5);g.gain.value=.5/m.chord.length;o.connect(g);g.connect(f);o.start();nodes.push(o);});
  const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.07;lg.gain.value=m.cut*.3;l.connect(lg);lg.connect(f.frequency);l.start();nodes.push(l);
  if(m.noise){const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;n.loop=true;const nf=c.createBiquadFilter();nf.type="bandpass";nf.frequency.value=1800;nf.Q.value=.4;const ng=c.createGain();ng.gain.value=.12;n.connect(nf);nf.connect(ng);ng.connect(out);n.start();nodes.push(n);}
  const t=setInterval(()=>{if(Math.random()>m.density||c.state!=="running")return;const o=c.createOscillator(),g=c.createGain(),now=c.currentTime;o.type="sine";o.frequency.value=m.scale[Math.floor(Math.random()*m.scale.length)]*(Math.random()<.25?2:1);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.16,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+2.2);o.connect(g);g.connect(out);o.start(now);o.stop(now+2.3);},m.step);
  return{fade(v,s){const now=c.currentTime;out.gain.cancelScheduledValues(now);out.gain.setValueAtTime(out.gain.value,now);out.gain.linearRampToValueAtTime(v*.5,now+s);},stop(){clearInterval(t);nodes.forEach(n=>{try{n.stop();}catch(e){}});setTimeout(()=>{try{out.disconnect();}catch(e){}},200);}};
}
function fileVoice(urlP){
  const a=new Audio();a.loop=true;a.volume=0;let lvl=0,tm,dead=false;
  urlP.then(u=>{if(dead)return;if(!u){toast("ยังเปิดไฟล์เสียงนี้ไม่ได้ เข้าสู่ระบบ Google ก่อน");return;}a.src=u;a.play().catch(()=>toast("เล่นไฟล์เสียงนี้ไม่ได้"));});
  return{fade(v,s){clearInterval(tm);const from=lvl,t0=performance.now();tm=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/(s*1000));lvl=from+(v-from)*p;a.volume=Math.max(0,Math.min(1,lvl*AE.vol));if(p>=1)clearInterval(tm);},60);},stop(){dead=true;clearInterval(tm);a.pause();a.removeAttribute("src");},setVol(){a.volume=Math.max(0,Math.min(1,lvl*AE.vol));}};
}
function makeVoice(k){
  if(!k||k==="none")return null;
  if(MOODS[k])return synthVoice(MOODS[k]);
  const f=allFileSounds().find(s=>"f:"+s.id===k);if(!f)return synthVoice(MOODS.calm);
  return fileVoice(soundURL(f));
}
function setScene(k,label){
  AE.want=k||"calm";AE.label=label||"";updatePlayer();
  if(!AE.on||AE.key===AE.want)return;
  const old=AE.voice;if(old){old.fade(0,AE.FADE);setTimeout(()=>old.stop(),AE.FADE*1000+150);}
  AE.key=AE.want;AE.voice=makeVoice(AE.key);if(AE.voice)AE.voice.fade(1,AE.FADE);
}
function toggleSound(){
  if(!AE.on){if(!ensureCtx()){toast("เบราว์เซอร์นี้เล่นเสียงไม่ได้");return;}AE.on=true;AE.key=null;setScene(AE.want,AE.label);}
  else{AE.on=false;const v=AE.voice;AE.voice=null;AE.key=null;if(v){v.fade(0,.6);setTimeout(()=>v.stop(),800);}}
  updatePlayer();
}
function updatePlayer(){
  $("pp").textContent=AE.on?"❚❚":"▶";$("player").classList.toggle("playing",AE.on);
  $("bSnd").textContent=AE.on?"♪ ปิดเสียง":"♪ เปิดเสียง";$("bSnd").classList.toggle("on",AE.on);
  if(AE.want){$("pl1").textContent=(AE.on?"":"แตะ ▶ · ")+soundName(AE.want);$("pl2").textContent=AE.label||"เสียงจะเปลี่ยนตามบทที่เลื่อนผ่าน";}
}

/* ---------- data: kept on this device first, then in Google Drive (Life Moment App) ---------- */
const S={people:[],chapters:[],moments:[],sounds:[],settings:{defaultSound:"calm"},gone:{},ts:0};
const L={dirty:false,rev:0,drive:{},trash:[],last:0};   // facts about this device only
let ready=false,filter=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IDB={db:null,mem:new Map(),
  open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("lifemoment",1);}catch(e){return rej(e);}r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("blobs");};r.onsuccess=()=>{IDB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  get(st,k){return IDB.db?IDB.tx(st,"readonly",o=>o.get(k)):Promise.resolve(IDB.mem.get(st+k));},
  put(st,k,v){if(!IDB.db){IDB.mem.set(st+k,v);return Promise.resolve();}return IDB.tx(st,"readwrite",o=>o.put(v,k));},
  del(st,k){if(!IDB.db){IDB.mem.delete(st+k);return Promise.resolve();}return IDB.tx(st,"readwrite",o=>o.delete(k));}};
const blobGet=k=>IDB.get("blobs",k).catch(()=>null), blobPut=(k,v)=>IDB.put("blobs",k,v), blobDel=k=>IDB.del("blobs",k).catch(()=>{});
function persistLocal(){const{rev,...l}=L;return IDB.put("kv","local",JSON.parse(JSON.stringify(l))).catch(()=>{});}
function persist(){persistLocal();return IDB.put("kv","data",JSON.parse(JSON.stringify(S))).catch(()=>toast("เครื่องนี้เก็บข้อมูลไม่ได้ พื้นที่อาจเต็ม"));}
function touch(){S.ts=Date.now();L.dirty=true;L.rev++;persist();render();syncSoon();}
async function saveDoc(coll,id,data){const row={id,...data,u:Date.now()};const i=S[coll].findIndex(x=>x.id===id);if(i>=0)S[coll][i]=row;else S[coll].push(row);touch();}
async function delDoc(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);S.gone[id]=Date.now();touch();}
const canWrite=()=>true;
const SAMPLE={settings:{defaultSound:"calm"},
  people:[{id:"p1",name:"ภรรยา",color:COLORS[0]},{id:"p2",name:"แม่",color:COLORS[1]},{id:"p3",name:"ครอบครัว",color:COLORS[2]}],
  chapters:[{id:"c1",title:"ใบไม้เปลี่ยนสีที่ฮอกไกโด",start:"2026-10-18",end:"2026-10-24",sound:"nostalgic"},{id:"c2",title:"วันเกิดแม่",start:"2026-05-10",end:"2026-05-10",sound:"warm"},{id:"c3",title:"ปีใหม่กับครอบครัว",start:"2025-12-31",end:"2026-01-01",sound:"celebrate"},{id:"c4",title:"ทะเลหน้าฝน",start:"2025-08-02",end:"2025-08-03",sound:"rain"}],
  moments:[
   {id:"s1",chapterId:"c1",date:"2026-10-19",title:"เช้าริมทะเลสาบโทยะ",place:"โทยาโกะ",story:"ข้อความตัวอย่าง เขียนสั้นๆ ว่าวันนั้นเกิดอะไรขึ้น ใครพูดอะไร อากาศเป็นอย่างไร",people:["p1","p2"],photos:[{g:"g2",w:4,h:3}]},
   {id:"s2",chapterId:"c1",date:"2026-10-21",title:"ใบไม้แดงที่โจซังเค",place:"โจซังเค",story:"ข้อความตัวอย่าง รูปหลายใบใน moment เดียวกันแตะเพื่อดูใบถัดไปได้",people:["p1","p2"],photos:[{g:"g1",w:4,h:5},{g:"g4",w:4,h:5}]},
   {id:"s3",chapterId:"c1",date:"2026-10-22",title:"คลองโอตารุตอนเย็น",place:"โอตารุ",story:"ข้อความตัวอย่าง",people:["p1"],photos:[{g:"g4",w:4,h:3}]},
   {id:"s4",chapterId:"c2",date:"2026-05-10",title:"เป่าเค้กกับแม่",place:"บ้าน",story:"ข้อความตัวอย่าง",people:["p2","p3"],photos:[{g:"g3",w:4,h:5}]},
   {id:"s5",chapterId:"c3",date:"2025-12-31",title:"นับถอยหลังด้วยกัน",place:"บ้าน",story:"ข้อความตัวอย่าง",people:["p1","p2","p3"],photos:[{g:"g6",w:4,h:5}]},
   {id:"s6",chapterId:"c4",date:"2025-08-02",title:"ฝนตกที่ชายหาด",place:"",story:"ข้อความตัวอย่าง",people:["p1"],photos:[{g:"g7",w:4,h:3}]}
  ]};
const isSample=()=>ready&&S.moments.length===0&&S.chapters.length===0;
const src=()=>isSample()?SAMPLE:S;

/* ---------- Google Drive ---------- */
const GD="https://www.googleapis.com/drive/v3",GDU="https://www.googleapis.com/upload/drive/v3",GDF="application/vnd.google-apps.folder",ROOT_NAME="Life Moment App";
const DR={busy:false,err:"",msg:"",again:false};
/* the Client ID set up in Momiji on this phone is used here too */
function gcid(){for(const k of["tp:gcid","hkd26:gcid"]){try{const v=JSON.parse(localStorage.getItem(k)||'""');if(v)return String(v);}catch(e){}}return "";}
const appBase=()=>location.origin+location.pathname.replace(/life\/.*$/,"");
function token(){try{const t=JSON.parse(sessionStorage.getItem("lmTok")||"null");if(t&&t.exp>Date.now()+90000)return t.tok;}catch(e){}return "";}
function signIn(){const st="life~"+uid();try{sessionStorage.setItem("lmState",st);}catch(e){}
  location.href="https://accounts.google.com/o/oauth2/v2/auth?"+new URLSearchParams({client_id:gcid(),redirect_uri:appBase(),response_type:"token",scope:"https://www.googleapis.com/auth/drive.file",state:st,include_granted_scopes:"true"});}
/* back from Google (the Momiji page at the app's address hands the answer on to here) */
(function(){try{const h=location.hash||"";if(!/(access_token|error)=/.test(h))return;const p=new URLSearchParams(h.slice(1));history.replaceState(null,"",location.pathname);
  if(sessionStorage.getItem("lmState")!==p.get("state"))return;sessionStorage.removeItem("lmState");
  if(p.get("access_token"))sessionStorage.setItem("lmTok",JSON.stringify({tok:p.get("access_token"),exp:Date.now()+(+p.get("expires_in")||3600)*1000}));
  else DR.err="เข้าสู่ระบบ Google ไม่สำเร็จ ("+(p.get("error")||"")+")";}catch(e){}})();
async function gd(url,opt){opt=opt||{};const tok=token();if(!tok)throw Object.assign(new Error("ต้องเข้าสู่ระบบ Google ก่อน"),{code:"auth"});
  for(let a=0;a<4;a++){let r;
    try{r=await fetch(url,{method:opt.method||"GET",headers:Object.assign({Authorization:"Bearer "+tok},opt.json?{"Content-Type":"application/json; charset=UTF-8"}:{},opt.headers||{}),body:opt.json?JSON.stringify(opt.json):opt.body});}
    catch(e){if(a===3)throw new Error("ต่อ Google Drive ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่");await sleep(1200*(a+1));continue;}
    if(r.ok)return opt.raw?r:(r.status===204?null:r.json());
    if(opt.ok404&&r.status===404)return null;
    if(r.status===401){try{sessionStorage.removeItem("lmTok");}catch(e){}throw Object.assign(new Error("การเข้าสู่ระบบ Google หมดเวลา"),{code:"auth"});}
    if(r.status===429||r.status>=500){await sleep(2000*(a+1));continue;}
    let m="";try{m=(await r.json()).error.message||"";}catch(e){}
    throw new Error("Google Drive ตอบว่า "+r.status+(m?" · "+m:""));}
  throw new Error("Google Drive ไม่ตอบ ลองใหม่อีกครั้ง");}
const enc=encodeURIComponent;
async function gdFind(name,parent,folder){const j=await gd(`${GD}/files?q=${enc(`'${parent}' in parents and trashed=false and name='${name.replace(/'/g,"\\'")}'`+(folder?` and mimeType='${GDF}'`:""))}&fields=files(id,name)&pageSize=5`);return(j.files||[])[0]||null;}
const gdMkdir=(name,parent)=>gd(`${GD}/files?fields=id`,{method:"POST",json:{name,mimeType:GDF,parents:[parent]}});
function gdUpload(blob,name,parent,mime){const b="lm"+uid();const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[parent]})}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,blob,`\r\n--${b}--`]);
  return gd(`${GDU}/files?uploadType=multipart&fields=id`,{method:"POST",headers:{"Content-Type":`multipart/related; boundary=${b}`},body});}
async function gdAlive(id){const j=await gd(`${GD}/files/${id}?fields=id,trashed`,{ok404:true});return!!(j&&!j.trashed);}
async function gdBlob(id){return(await gd(`${GD}/files/${id}?alt=media`,{raw:true})).blob();}
async function ensureFolders(){
  if(!L.drive.root||!(await gdAlive(L.drive.root))){const f=await gdFind(ROOT_NAME,"root",true)||await gdMkdir(ROOT_NAME,"root");L.drive={root:f.id};}
  const D=L.drive;
  if(!D.photos)D.photos=(await gdFind("รูป",D.root,true)||await gdMkdir("รูป",D.root)).id;
  if(!D.sounds)D.sounds=(await gdFind("เสียง",D.root,true)||await gdMkdir("เสียง",D.root)).id;
  if(!D.data){const f=await gdFind("ข้อมูล.json",D.root);if(f)D.data=f.id;}
  persistLocal();
}
const COLLS=["people","chapters","moments","sounds"];
function sig(o){const out={};COLLS.forEach(c=>{out[c]=[...(o[c]||[])].sort((a,b)=>a.id<b.id?-1:1).map(x=>[x.id,x.u||0,c==="moments"?(x.photos||[]).map(p=>p.d||"").join():x.d||""]);});out.g=Object.keys(o.gone||{}).sort();out.s=(o.settings||{}).defaultSound||"";return JSON.stringify(out);}
/* take what another device saved: per item the newer one wins, and something deleted anywhere stays deleted */
function merge(R){
  if(!R||typeof R!=="object")return false;const before=sig(S);
  const gone=Object.assign({},S.gone);Object.keys(R.gone||{}).forEach(k=>{if(!(gone[k]>=R.gone[k]))gone[k]=R.gone[k];});
  COLLS.forEach(c=>{const m=new Map();S[c].forEach(x=>m.set(x.id,x));(R[c]||[]).forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x);});S[c]=[...m.values()].filter(x=>!(gone[x.id]>=(x.u||0)));});
  S.gone=gone;if(R.settings&&(R.settings.u||0)>(S.settings.u||0))S.settings=R.settings;
  const after=sig(S);if(after!==sig(R)){L.dirty=true;}
  if(after!==before){S.ts=Math.max(S.ts||0,R.ts||0);return true;}return false;
}
const dataOut=()=>({app:"lifemoment",v:1,ts:S.ts,people:S.people,chapters:S.chapters,moments:S.moments,sounds:S.sounds,settings:S.settings,gone:S.gone});
function pending(){let n=0;S.moments.forEach(m=>(m.photos||[]).forEach(p=>{if(p.id&&!p.d)n++;}));S.sounds.forEach(x=>{if(!x.d)n++;});return n+(L.dirty?1:0)+(L.trash.length?1:0);}
let syncT;function syncSoon(ms){clearTimeout(syncT);syncT=setTimeout(sync,ms==null?2500:ms);}
async function sync(){
  if(DR.busy){DR.again=true;return;}
  if(!gcid()||!token()){paintDrive();return;}
  if(navigator.onLine===false){DR.err="ไม่มีอินเทอร์เน็ต จะเก็บลง Drive เมื่อออนไลน์";paintDrive();return;}
  DR.busy=true;DR.err="";DR.msg="กำลังเชื่อม Google Drive…";paintDrive();
  try{
    await ensureFolders();const D=L.drive;

    if(L.dirty||!D.data){DR.msg="กำลังเก็บข้อมูล…";paintDrive();const rev=L.rev,blob=new Blob([JSON.stringify(dataOut())],{type:"application/json"});

const urlC=new Map(),urlP=new Map();let dl=0;const dlQ=[];
const slot=()=>dl<4?(dl++,Promise.resolve()):new Promise(r=>dlQ.push(r)), unslot=()=>{const n=dlQ.shift();if(n)n();else dl--;};
function findPhoto(pid){for(const m of S.moments)for(const p of m.photos||[])if(p.id===pid)return p;return null;}
function photoURL(pid,full){
  const k=pid+(full?":f":":t");if(urlC.has(k))return Promise.resolve(urlC.get(k));if(urlP.has(k))return urlP.get(k);
  const job=(async()=>{const b=await blobGet(pid)||{};let blob=full?(b.full||null):(b.thumb||b.full||null);
    if(!blob){const p=findPhoto(pid),fid=p&&(full?p.d:(p.dt||p.d));if(!fid||!token())return"";

      if(full||!p.dt)b.full=blob;else b.thumb=blob;await blobPut(pid,b).catch(()=>{});}
    const u=URL.createObjectURL(blob);urlC.set(k,u);return u;})().catch(()=>"").finally(()=>urlP.delete(k));
  urlP.set(k,job);return job;
}
function soundURL(f){const k="snd:"+f.id;if(urlC.has(k))return Promise.resolve(urlC.get(k));

const photoHTML=(p,alt,full)=>p.g?`<div class="fill ${p.g}" role="img" aria-label="ภาพตัวอย่าง"></div>`:p.url?`<img src="${esc(p.url)}" alt="">`:`<img data-pid="${esc(p.id)}"${full?' data-full="1"':""} alt="${esc(alt||"")}">`;
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target);}}),{rootMargin:"800px"}):null;

async function exifDate(file){
  try{const v=new DataView(await file.slice(0,262144).arrayBuffer());if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o+4<v.byteLength){const mk=v.getUint16(o),len=v.getUint16(o+2);if((mk&0xFF00)!==0xFF00)break;
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10,le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const find=(ifd,tag)=>{const n=g16(ifd);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(g16(e)===tag)return e;}return -1;};
        const ifd0=t+g32(t+4);let de=-1;const ep=find(ifd0,0x8769);if(ep>=0)de=find(t+g32(ep+8),0x9003);if(de<0)de=find(ifd0,0x0132);if(de<0)return null;
        const sp=t+g32(de+8);let s="";for(let i=0;i<10;i++)s+=String.fromCharCode(v.getUint8(sp+i));const m=s.match(/^(\d{4}):(\d{2}):(\d{2})$/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;}
      o+=2+len;}
  }catch(e){}return null;
}
async function shrink(file,max,q){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(e){
    bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=URL.createObjectURL(file);});}
  const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight,k=Math.min(1,(max||1800)/Math.max(W,H)),w=Math.round(W*k),h=Math.round(H*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q||.86));if(!blob)throw new Error("encode");return{blob,w,h};
}

    let chapterId=$("edChapter").value;
    if(chapterId==="__new"){const cn=$("edNewCh").value.trim();if(cn){chapterId=uid();await saveDoc("chapters",chapterId,{title:cn,start:date,end:date,sound:"warm"});}else chapterId="";}
    const id=ED.id||uid();const old=S.moments.find(x=>x.id===id);
    await saveDoc("moments",id,{title,date,place:$("edPlace").value.trim(),story:$("edStory").value.trim(),people:[...ED.people],chapterId:chapterId||"",photos,createdAt:(old&&old.createdAt)||Date.now()});
    for(const p of ED.removed){if(p.d)L.trash.push(p.d);if(p.dt)L.trash.push(p.dt);blobDel(p.id);}
    closeOv();toast("บันทึกแล้ว");setTimeout(()=>{const el=$("m-"+id);if(el)el.scrollIntoView({block:"center",behavior:"smooth"});},400);
  }catch(e){$("edMsg").textContent="บันทึกไม่สำเร็จ: "+(e.message||e.code||"ลองอีกครั้ง");$("edSave").disabled=false;}
}
async function delMoment(btn){
  if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="แตะอีกครั้งเพื่อลบถาวร";setTimeout(()=>{btn.dataset.sure="";btn.textContent="ลบ moment นี้";},4000);return;}
  const m=S.moments.find(x=>x.id===ED.id);if(!m)return;
  try{for(const p of m.photos||[]){if(p.d)L.trash.push(p.d);if(p.dt)L.trash.push(p.dt);if(p.id)blobDel(p.id);}await delDoc("moments",m.id);closeOv();toast("ลบแล้ว รูปใน Drive ย้ายไปถังขยะ");}
  catch(e){$("edMsg").textContent="ลบไม่สำเร็จ: "+(e.message||e.code);}
}

/* chapter editor */
let CH=null;
function openChapter(id){const c=S.chapters.find(x=>x.id===id);if(!c)return;CH=id;$("chName").value=c.title;$("chStart").value=c.start||"";$("chEnd").value=c.end||"";$("chSound").innerHTML=soundOptions(c.sound||"warm");$("chMsg").textContent="";$("chDel").dataset.sure="";$("chDel").textContent="ลบบทนี้ (moment ยังอยู่)";openOv("ovChap");}
async function saveChapter(){const t=$("chName").value.trim();if(!t){$("chMsg").textContent="ใส่ชื่อบท";return;}let a=$("chStart").value,b=$("chEnd").value;if(a&&b&&b<a)[a,b]=[b,a];
  try{await saveDoc("chapters",CH,{title:t,start:a,end:b||a,sound:$("chSound").value});closeOv();toast("บันทึกแล้ว");}catch(e){$("chMsg").textContent="บันทึกไม่สำเร็จ: "+(e.message||e.code);}}
async function delChapter(btn){if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="แตะอีกครั้งเพื่อลบบท";return;}try{await delDoc("chapters",CH);closeOv();}catch(e){$("chMsg").textContent="ลบไม่สำเร็จ";}}

/* sound sheet */
function renderSound(){
  const sample=isSample(),d=src();
  let h=groups.filter(g=>g.chapter).map(g=>`<div class="srow${g.key===curGroup?" cur":""}"><div><div class="st">${esc(g.title)}</div><div class="ss">${esc(fmtRange(g.chapter.start,g.chapter.end))}</div></div>${sample||!canWrite()?`<span class="ss">♪ ${esc(soundName(g.sound))}</span>`:`<select data-chg="chSound" data-id="${esc(g.chapter.id)}" aria-label="เสียงของบท ${esc(g.title)}">${soundOptions(g.sound)}</select>`}<button class="btn" data-act="jump" data-g="${esc(g.key)}">ฟัง</button></div>`).join("");
  h+=`<div class="srow"><div><div class="st">moment ที่ไม่อยู่ในบท</div><div class="ss">เพลงพื้นหลังทั่วไป</div></div>${sample||!canWrite()?`<span class="ss">♪ ${esc(soundName(d.settings.defaultSound))}</span>`:`<select data-chg="defSound" aria-label="เพลงพื้นหลังทั่วไป">${soundOptions(d.settings.defaultSound)}</select>`}<span></span></div>`;
  $("sdList").innerHTML=h;$("vol").value=Math.round(AE.vol*100);
}
async function onSoundFile(f){
  if(!f)return;const title=f.name.replace(/\.[^.]+$/,"").slice(0,60),id="s"+uid(),ext=((f.name.match(/\.([A-Za-z0-9]+)$/)||[])[1]||"m4a").toLowerCase();
  if(f.size>60*1048576){$("sdMsg").textContent="ไฟล์ใหญ่เกิน 60 MB";return;}
  try{await blobPut("snd:"+id,{full:f});await saveDoc("sounds",id,{title,ext,mime:f.type||"audio/mpeg"});$("sdMsg").textContent=`เพิ่ม “${title}” แล้ว เลือกใช้กับบทได้เลย`;}
  catch(e){$("sdMsg").textContent="เพิ่มไฟล์เสียงไม่ได้ พื้นที่ในเครื่องอาจเต็ม";}
}

/* ---------- book ---------- */
const B={pages:[],cur:0,single:false,n:0,auto:null};
function makePages(){
  const d=src();const gs=[...groups].reverse().map(g=>({...g,moments:[...g.moments].reverse()})).filter(g=>g.moments.length);
  const all=gs.flatMap(g=>g.moments);const who=filter?(d.people.find(p=>p.id===filter)||{}).name:null;
  const first=all[0],last=all[all.length-1];const def=d.settings.defaultSound||"calm";
  const P=[];const cov=(all.find(m=>(m.photos||[]).length)||{}).photos;
  P.push({t:"cover",title:who?`เรื่องของเรากับ${who}`:"เรื่องของเรา",sub:first?`${first.date.slice(0,4)===last.date.slice(0,4)?first.date.slice(0,4):first.date.slice(0,4)+" – "+last.date.slice(0,4)}`:"",photo:cov&&cov[0],scene:gs[0]?gs[0].sound:def,label:"ปกหนังสือ"});
  P.push({t:"intro",n:all.length,c:gs.length,scene:gs[0]?gs[0].sound:def,label:"ปกหนังสือ"});
  const toc={t:"toc",items:[],scene:gs[0]?gs[0].sound:def,label:"สารบัญ"};P.push(toc);
  gs.forEach(g=>{
    toc.items.push({title:g.title,page:P.length});
    P.push({t:"chap",g,scene:g.sound,label:g.title});
    const list={t:"list",g,items:[],scene:g.sound,label:g.title};P.push(list);
    g.moments.forEach(m=>{list.items.push({title:m.title,date:m.date,page:P.length});P.push({t:"photo",m,pi:0,scene:g.sound,label:g.title});P.push({t:"text",m,g,scene:g.sound,label:g.title});});
  });
  const ls=gs.length?gs[gs.length-1].sound:def;
  P.push({t:"end",n:all.length,scene:ls,label:"ท้ายเล่ม"});P.push({t:"blank",scene:ls,label:"ท้ายเล่ม"});
  return P;
}
function pageHTML(p,i){
  const d=src(),no=i>1?`<span class="no">${i}</span>`:"";
  const ppl=m=>(m.people||[]).map(id=>d.people.find(x=>x.id===id)).filter(Boolean).map(x=>`<span class="tag"><span class="dot" style="background:${esc(x.color)}"></span>${esc(x.name)}</span>`).join("");
  switch(p.t){
    case"cover":return`<div class="pg cover">${p.photo?`<div class="cph">${photoHTML(p.photo)}</div>`:""}<span class="eb">Life Moment Book</span><h2>${esc(p.title)}</h2><span>${esc(p.sub)}</span></div>`;
    case"intro":return`<div class="pg" style="justify-content:center"><span class="eb">เล่มนี้มี</span><h2>${p.n} moments<br>${p.c} บท</h2><span class="mut">พลิกหน้าด้วยปุ่มลูกศร ปัดซ้ายขวา หรือกดปุ่มลูกศรบนคีย์บอร์ด เสียงจะเปลี่ยนไปตามบทที่เปิดอยู่</span></div>`;
    case"toc":return`<div class="pg"><span class="eb">สารบัญ</span><div class="toc">${p.items.map(x=>`<button data-act="bGo" data-p="${x.page}"><span>${esc(x.title)}</span><span>${x.page}</span></button>`).join("")||`<span class="mut">ยังไม่มีบท</span>`}</div>${no}</div>`;
    case"chap":return`<div class="pg chap"><span class="eb">${p.g.chapter?esc(fmtRange(p.g.chapter.start,p.g.chapter.end)):"รวม moment"}</span><h2>${esc(p.g.title)}</h2><span class="mut">♪ ${esc(soundName(p.g.sound))}</span>${no}</div>`;
    case"list":return`<div class="pg"><span class="eb">ในบทนี้</span><div class="toc">${p.items.map(x=>`<button data-act="bGo" data-p="${x.page}"><span>${esc(x.title)}</span><span>${esc(fmt(x.date).replace(/ \d{4}$/,""))}</span></button>`).join("")}</div>${no}</div>`;
    case"photo":{const ps=p.m.photos||[];const ph=ps[p.pi%Math.max(1,ps.length)];return`<div class="pg photo"><div class="frame"${ps.length>1?` data-act="bPhoto" data-p="${i}" style="cursor:pointer"`:""}>${ph?photoHTML(ph,p.m.title,true):""}${ps.length>1?`<span class="more">${p.pi%ps.length+1}/${ps.length} · แตะดูรูปถัดไป</span>`:""}</div><div class="cap"><span>${esc(fmt(p.m.date))}</span><span>${esc(p.m.place||"")}</span></div></div>`;}
    case"text":return`<div class="pg"><span class="eb">${esc(fmt(p.m.date))}${p.m.place?" · "+esc(p.m.place):""}</span><h3>${esc(p.m.title)}</h3>${p.m.story?`<p>${esc(p.m.story)}</p>`:""}<div class="tags">${ppl(p.m)}</div>${no}</div>`;
    case"end":return`<div class="pg" style="justify-content:center"><span class="eb">ถึงตรงนี้</span><h2>${p.n} moments<br>ที่เก็บไว้ด้วยกัน</h2>${no}</div>`;
    default:return`<div class="pg" style="justify-content:center;align-items:flex-start"><span class="mut">หน้านี้ยังว่าง รอ moment ต่อไป</span>${canWrite()?`<button class="cta" data-act="add">＋ เพิ่ม moment</button>`:""}</div>`;
  }
}
function openBook(){
  buildGroups();B.cur=0;const who=filter?(src().people.find(p=>p.id===filter)||{}).name:null;
  $("bTtl").textContent=who?`Life Moment Book · ${who}`:"Life Moment Book";
  openOv("ovBook");buildBook();
}
function buildBook(){
  B.single=innerWidth<760;B.pages=makePages();const per=B.single?1:2;B.n=Math.ceil(B.pages.length/per);B.cur=Math.min(B.cur,B.n-1);
  const el=$("book");el.classList.toggle("single",B.single);el.innerHTML="";
  for(let i=0;i<B.n;i++){const l=document.createElement("div");l.className="leaf";l.innerHTML=`<div class="face front"></div><div class="face back"></div>`;el.appendChild(l);}
  sizeBook();el.classList.add("instant");drawBook();void el.offsetWidth;el.classList.remove("instant");
}
function sizeBook(){
  const w=$("bWrap"),aw=w.clientWidth-32,ah=w.clientHeight-16;let bw,bh;
  if(B.single){bh=Math.min(ah,aw*4/3);bw=bh*3/4;}else{bh=Math.min(ah,aw/1.5);bw=bh*1.5;}
  const el=$("book");el.style.width=bw+"px";el.style.height=bh+"px";el.style.fontSize=Math.max(11,bh/32)+"px";
}
function fillLeaf(i,force){
  const l=$("book").children[i];if(!l||(l.dataset.f&&!force))return;l.dataset.f="1";const per=B.single?1:2;
  const fi=i*per;l.children[0].innerHTML=B.pages[fi]?pageHTML(B.pages[fi],fi):"";
  if(!B.single){const bi=fi+1;l.children[1].innerHTML=B.pages[bi]?pageHTML(B.pages[bi],bi):"";}
  hydrate(l);
}
function drawBook(){
  const el=$("book"),ls=el.children;
  for(let i=Math.max(0,B.cur-2);i<=Math.min(B.n-1,B.cur+2);i++)fillLeaf(i);
  for(let i=0;i<B.n;i++){const l=ls[i],f=i<B.cur,was=l.classList.contains("flipped");const z=f?i+1:B.n-i;
    if(f!==was){l.style.zIndex=B.n+10;l.classList.toggle("flipped",f);setTimeout(()=>{l.style.zIndex=(i<B.cur)?i+1:B.n-i;},430);}else l.style.zIndex=z;}
  el.style.transform=(!B.single&&B.cur===0)?"translateX(-25%)":"";
  const vi=B.single?B.cur:Math.min(2*B.cur,B.pages.length-1);const p=B.pages[vi];
  $("bPos").textContent=B.cur===0?"หน้าปก":B.single?`${B.cur} / ${B.pages.length-1}`:`${Math.max(1,2*B.cur-1)}–${Math.min(2*B.cur,B.pages.length-1)} / ${B.pages.length-1}`;
  $("bPrev").disabled=B.cur===0;$("bNext").disabled=B.cur>=B.n-1;
  if(p)setScene(p.scene,p.label);
}
function bookGo(k){B.cur=Math.max(0,Math.min(B.n-1,k));drawBook();if(B.cur>=B.n-1)stopAuto();}
function bookJump(page){const el=$("book");el.classList.add("instant");bookGo(B.single?page:Math.ceil(page/2));void el.offsetWidth;el.classList.remove("instant");}
function stopAuto(){if(B.auto){clearInterval(B.auto);B.auto=null;}$("bAuto").textContent="เล่นเอง";$("bAuto").classList.remove("on");}
function toggleAuto(){if(B.auto){stopAuto();return;}if(B.cur>=B.n-1)bookJump(0);B.auto=setInterval(()=>bookGo(B.cur+1),6000);$("bAuto").textContent="หยุดเล่น";$("bAuto").classList.add("on");if(!AE.on)toggleSound();}
let tx=null;
$("bWrap").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
$("bWrap").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>45)bookGo(B.cur+(dx<0?1:-1));},{passive:true});
addEventListener("resize",()=>{if(!$("ovBook").classList.contains("open"))return;if((innerWidth<760)!==B.single){const vi=B.single?B.cur:2*B.cur;buildBook();bookJump(Math.min(vi,B.pages.length-1));}else sizeBook();});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(document.querySelector(".ov.open"))closeOv();return;}
  if($("ovBook").classList.contains("open")){if(e.key==="ArrowRight")bookGo(B.cur+1);if(e.key==="ArrowLeft")bookGo(B.cur-1);}
  else if($("ovDetail").classList.contains("open")){if(e.key==="ArrowRight")stepPhoto(1);if(e.key==="ArrowLeft")stepPhoto(-1);}
});
function stepPhoto(k){const m=src().moments.find(x=>x.id===DT.id);if(!m)return;const n=(m.photos||[]).length;if(n<2)return;DT.i=(DT.i+k+n)%n;drawDetail();}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){if(e.target.classList.contains("scrim"))closeOv();return;}
  const a=t.dataset.act;
  switch(a){
    case"toggle":toggleSound();break;
    case"sound":renderSound();openOv("ovSound");break;
    case"drive":openOv("ovDrive");paintDrive();break;
    case"drvLogin":signIn();break;
    case"drvNow":sync();break;
    case"drvSave":{const v=$("drvCid").value.trim();if(!/\.apps\.googleusercontent\.com$/.test(v)){$("drvMsg").textContent="Client ID ต้องลงท้ายด้วย .apps.googleusercontent.com";break;}try{localStorage.setItem("tp:gcid",JSON.stringify(v));}catch(e){}signIn();break;}
    case"close":closeOv();break;
    case"filter":filter=t.dataset.id||null;render();scrollTo({top:0});break;
    case"year":{const g=groups.find(x=>x.date.slice(0,4)===t.dataset.y);const el=g&&document.querySelector(`.group[data-g="${CSS.escape(g.key)}"]`);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});break;}
    case"open":openDetail(t.dataset.id);break;
    case"dPrev":stepPhoto(-1);break;
    case"dNext":stepPhoto(1);break;
    case"editCur":openEditor(DT.id);break;
    case"add":if(canWrite())openEditor(null);break;
    case"rmPhoto":{const p=ED.photos.splice(+t.dataset.i,1)[0];if(p&&p.id)ED.removed.push(p);drawEditor();break;}
    case"togPerson":{const id=t.dataset.id;ED.people.has(id)?ED.people.delete(id):ED.people.add(id);drawEditor();break;}
    case"addPerson":addPerson();break;
    case"saveMoment":saveMoment();break;
    case"delMoment":delMoment(t);break;
    case"editChapter":openChapter(t.dataset.id);break;
    case"saveChapter":saveChapter();break;
    case"delChapter":delChapter(t);break;
    case"jump":{const k=t.dataset.g;closeOv();const el=document.querySelector(`.group[data-g="${CSS.escape(k)}"]`);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});const g=groups.find(x=>x.key===k);if(g){if(!AE.on)toggleSound();setScene(g.sound,g.title);}break;}
    case"book":openBook();break;
    case"bPrev":stopAuto();bookGo(B.cur-1);break;
    case"bNext":stopAuto();bookGo(B.cur+1);break;
    case"bGo":stopAuto();bookJump(+t.dataset.p);break;
    case"bAuto":toggleAuto();break;
    case"bPhoto":{const i=+t.dataset.p,p=B.pages[i];p.pi++;fillLeaf(B.single?i:Math.floor(i/2),true);break;}
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="edFiles"){onFiles([...t.files]);}
  else if(t.id==="edDate"){ED.dateTouched=true;}
  else if(t.id==="edChapter"){$("edNewChWrap").hidden=t.value!=="__new";if(t.value==="__new")$("edNewCh").focus();}
  else if(t.id==="sdFile"){onSoundFile(t.files[0]);t.value="";}
  else if(t.dataset.chg==="chSound"){const c=S.chapters.find(x=>x.id===t.dataset.id);if(c){const{id,...rest}=c;await saveDoc("chapters",id,{...rest,sound:t.value});if(!AE.on)toggleSound();setScene(t.value,c.title);}}
  else if(t.dataset.chg==="defSound"){S.settings={defaultSound:t.value,u:Date.now()};touch();}
});
$("vol").addEventListener("input",e=>{AE.vol=e.target.value/100;if(AE.master)AE.master.gain.value=AE.vol;if(AE.voice&&AE.voice.setVol)AE.voice.setVol();});
$("edNewPerson").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addPerson();}});

boot();
</script>
