<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14191E">
<title>Tripbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap">
<style>
:root{--ink:#1C2228;--mute:#69737D;--line:#DDE3E0;--acc:#2F6FB3;--err:#C0392B;--ok:#1E8E3E}
[hidden]{display:none!important}
#book .tb-dt{table-layout:fixed}
#book .tb-run span:last-child{flex:0 1 auto;min-width:0;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html,body{margin:0;background:#14191E;color:var(--ink);font-family:"Anuphan",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#lock{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:#fff;transition:opacity .45s}
#lock.out{opacity:0}
.bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,#3B5A70 0%,#1C2228 65%) center/cover no-repeat;transform:scale(1.02);transition:opacity .6s}
.bg.pic{background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,18,.05) 0%,rgba(10,14,18,.15) 35%,rgba(10,14,18,.78) 68%,rgba(10,14,18,.94) 100%)}
.wrap{position:relative;width:100%;max-width:460px;margin:0 auto;padding:24px 16px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.kick{margin:0 0 6px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
h1{margin:0;font-size:34px;line-height:1.12;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.sub{margin:8px 0 0;font-size:15px;line-height:1.45;opacity:.92}
.card{margin-top:18px;background:#fff;color:var(--ink);border-radius:20px;padding:18px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card .hi{margin:0 0 2px;font-size:17px;font-weight:700}
.card .lo{margin:0 0 12px;font-size:13.5px;color:var(--mute);line-height:1.5}
.field{display:flex;gap:8px}
.card input[type=text]{flex:1;min-width:0;box-sizing:border-box;font:700 22px/1.2 "Anuphan",ui-monospace,monospace;letter-spacing:.12em;text-align:center;padding:13px 10px;border:1.5px solid var(--line);border-radius:14px;outline:none;color:var(--ink);background:#F7F9F8}
.card input[type=text]:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(47,111,179,.16)}
.card input.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;font:700 16px "Anuphan",system-ui,sans-serif;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
.go:disabled{opacity:.75}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rem{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--mute)}
.rem input{width:18px;height:18px;accent-color:var(--acc)}
.err{color:var(--err);font-size:14px;line-height:1.45;margin-top:10px}
.err small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.foot{margin:12px 2px 0;font-size:12px;opacity:.7;text-align:center}
#bar{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform .25s,opacity .4s;z-index:50;opacity:0}
#book{background:#fff;min-height:100vh}
#book img[data-r],#book img[data-d]{background:#EEF1F3}
.tb-toc{max-width:880px;margin:0 auto;padding:34px 18px 24px}
.tb-toc h2{font-size:26px;margin:4px 0 14px}
.tb-toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tb-toc li{border:1px solid #E3E8E5;border-radius:14px;overflow:hidden;background:#fff}
.tb-toc a{color:#1C2228;text-decoration:none}
.tc-x a{display:block;padding:14px 14px;font-weight:600;font-size:16px}
.tc-d{display:flex;gap:12px;align-items:center;padding:12px 14px}
.tc-n{font-size:32px;font-weight:700;line-height:1;color:var(--dc);min-width:28px}
.tc-d span:last-child{font-weight:600;font-size:15.5px;line-height:1.35}
.tc-d small{display:block;font-weight:400;font-size:12.5px;color:#69737D}
.tc-s{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 54px}
.tc-s a{font-size:13px;padding:5px 10px;border-radius:999px;background:#F3F6F4;color:#3D4650}
.tc-s a b{color:var(--dc);margin-right:5px}
#tocb{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;padding:12px 16px;background:#1C2228;color:#fff;font:600 14.5px "Anuphan",system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
.tc-back{margin:4px 0 26px;text-align:center}
.tc-back a{display:inline-block;padding:8px 16px;border-radius:999px;background:#F3F6F4;color:#2F6FB3;font-weight:600;font-size:14px;text-decoration:none}
figure .spr{position:absolute;inset:0;background-size:800% 100%;background-repeat:no-repeat;animation:spr 6s steps(8,jump-none) infinite;pointer-events:none}
@keyframes spr{from{background-position:0% 0}to{background-position:100% 0}}
@media (prefers-reduced-motion:reduce){ figure .spr{animation:none} }
#vo{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
#vo .vs{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#vo iframe,#vo video{width:100%;height:100%;border:0;background:#000;object-fit:contain}
#vo .vx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer}
#vo .vw{color:#ccc;font-size:15px}
@media (min-width:700px){ h1{font-size:44px} .wrap{padding-bottom:48px} }
</style>
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<main id="lock">
  <div class="bg" id="bg"></div><div class="shade"></div>
  <div class="wrap">
    <p class="kick">Tripbook</p>
    <h1 id="ttl">เปิดดูทริปของเรา</h1>
    <p class="sub" id="sub"></p>
    <form class="card" id="f" autocomplete="off" novalidate>
      <p class="hi">🔒 ใส่รหัสเพื่อเปิดดู</p>
      <p class="lo" id="msg">รหัสส่งมาพร้อมกับลิงก์นี้</p>
      <div class="field"><input type="text" id="pw" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="รหัสเปิด" aria-label="รหัสเปิด Tripbook" enterkeyhint="go"></div>
      <button class="go" id="go" type="submit"><span id="goT">เปิดดู Tripbook</span></button>
      <label class="rem"><input type="checkbox" id="rem" checked> จำรหัสไว้ในเครื่องนี้ ครั้งหน้าไม่ต้องใส่อีก</label>
      <div class="err" id="err" role="alert"></div>
    </form>
    <p class="foot">ทริปนี้แชร์ให้เฉพาะคนที่ได้รับลิงก์และรหัส</p>
  </div>
</main>
<div id="book" hidden></div>
<script>
(function(){
  "use strict";
  var $=function(s){ return document.querySelector(s); };
  var id=(location.hash||"").replace(/^#/,"").replace(/[^A-Za-z0-9_-]/g,"");
  var q=new URLSearchParams(location.search), host=location.hostname;
  var owner=q.get("o")||(/\.github\.io$/.test(host)?host.split(".")[0]:""), repo=q.get("r")||(location.pathname.split("/").filter(Boolean)[0]||""), BR=q.get("b")||"tripbooks";
  var PX="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  var enc=new TextEncoder(), dec=new TextDecoder(), REF=null, MF=null, mfP=null, KEY=null, M=null, packs={}, urls={}, busy=0, done=0, why=[];
  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function norm(p){ return String(p||"").toUpperCase().replace(/[\s-]/g,""); }
  function err(t,detail){ $("#err").innerHTML=t?t+(detail?"<small>"+detail+"</small>":""):""; }
  function bar(){ var b=$("#bar"), n=busy+done; if(!busy){ b.style.opacity="0"; return; } b.style.opacity="1"; b.style.transform="scaleX("+Math.max(.05,done/Math.max(1,n))+")"; }
  function wait(on,t){ var g=$("#go"); g.disabled=on; g.innerHTML=on?'<i class="spin"></i><span>'+t+'</span>':'<span>เปิดดู Tripbook</span>'; }
  /* every request gives up after a while, and the files come from GitHub, or its CDN copy if GitHub can't be reached */
  async function tget(url,ms,opt){ var c=new AbortController(), t=setTimeout(function(){ c.abort(); },ms); try{ return await fetch(url,Object.assign({signal:c.signal},opt||{})); } finally{ clearTimeout(t); } }
  async function headRef(){ try{ var r=await tget("https://api.github.com/repos/"+owner+"/"+repo+"/git/ref/heads/"+BR,7000,{cache:"no-store"}); if(r.ok){ var j=await r.json(); if(j&&j.object&&j.object.sha) return j.object.sha; } else why.push("api "+r.status); }catch(e){ why.push("api "+(e.name==="AbortError"?"timeout":"offline")); } return BR; }
  function sources(path){ return ["https://raw.githubusercontent.com/"+owner+"/"+repo+"/"+REF+"/"+id+"/"+path,"https://cdn.jsdelivr.net/gh/"+owner+"/"+repo+"@"+REF+"/"+id+"/"+path]; }
  async function get(path,ms,asText){ var S=sources(path), last="net";
    for(var i=0;i<S.length;i++){ try{ var r=await tget(S[i],ms,{cache:path==="m.json"?"no-store":"default"});
        if(r.status===404&&i===0){ throw Object.assign(new Error("gone"),{fin:true}); }
        if(r.ok) return asText?await r.text():new Uint8Array(await r.arrayBuffer()); why.push((i?"cdn ":"raw ")+r.status); }
      catch(e){ if(e.fin) throw e; why.push((i?"cdn ":"raw ")+(e.name==="AbortError"?"timeout":"offline")); } }
    throw new Error(last); }
  async function deriveKey(pass,salt,it){ var k=await crypto.subtle.importKey("raw",enc.encode(norm(pass)),"PBKDF2",false,["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]); }
  async function unseal(key,u){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.subarray(0,12)},key,u.subarray(12))); }
  /* the contents page is fetched as soon as the link opens: its cover and title show before the passcode */
  function loadMF(){ if(!mfP) mfP=(async function(){ if(!id||!owner||!repo) throw new Error("link"); if(!REF) REF=await headRef(); MF=JSON.parse(await get("m.json",15000,true)); paintPub(MF.pub); return MF; })().catch(function(e){ mfP=null; throw e; }); return mfP; }
  function paintPub(p){ if(!p) return; if(p.title){ $("#ttl").textContent=p.title; document.title=p.title+" · Tripbook"; } if(p.sub) $("#sub").textContent=p.sub;
    if(p.cover){ var im=new Image(); im.onload=function(){ var bg=$("#bg"); bg.style.backgroundImage='url("'+p.cover+'")'; bg.classList.add("pic"); }; im.src=p.cover; }
    if(p.kb==="num") $("#pw").setAttribute("inputmode","numeric"); }
  async function unlock(pass){
    if(!window.crypto||!crypto.subtle) throw new Error("old");
    await loadMF(); wait(true,"กำลังตรวจรหัส…");
    var key=await deriveKey(pass,b64(MF.salt),MF.it), pt;
    try{ pt=await unseal(key,b64(MF.d)); }catch(e){ throw new Error("bad"); }
    KEY=key; M=JSON.parse(dec.decode(pt)); }
  function pack(i){ if(!packs[i]) packs[i]=get(M.packs[i],30000).then(function(u){ return unseal(KEY,u); }).catch(function(e){ delete packs[i]; throw e; }); return packs[i]; }
  async function load(im){ var r=M.refs[+im.getAttribute("data-r")]; if(!r) return; busy++; bar();
    try{ var k=r.join(","); if(!urls[k]){ var p=await pack(r[0]); urls[k]=URL.createObjectURL(new Blob([p.subarray(r[1],r[1]+r[2])],{type:r[3]||"image/jpeg"})); } im.src=urls[k]; }
    catch(e){ setTimeout(function(){ io.observe(im); },4000); }
    busy--; done++; bar(); }
  var io=null;
  async function sprite(f){ var r=M.refs[+f.getAttribute("data-spr")]; if(!r) return; var url;
    try{ if(r[0]==="d") url="https://lh3.googleusercontent.com/d/"+r[1]+"=w2560"; else { var k=r.join(","); if(!urls[k]){ var p=await pack(r[0]); urls[k]=URL.createObjectURL(new Blob([p.subarray(r[1],r[1]+r[2])],{type:r[3]||"image/jpeg"})); } url=urls[k]; }
      var im=new Image(); im.onload=function(){ var s=document.createElement("span"); s.className="spr"; s.style.backgroundImage='url("'+url+'")'; f.insertBefore(s,f.firstChild.nextSibling); }; im.src=url; }catch(e){} }
  function render(){
    document.title=M.title||"Tripbook";
    var st=document.createElement("style"); st.textContent=(M.css||"")+"\nbody{margin:0;background:#fff}"; document.head.appendChild(st);
    /* pictures are either locked inside packs here, or plain files in the owner's Google Drive */
    var html=String(M.html||"").replace(/src="tbr:(\d+)"/g,function(x,n){ var r=M.refs[+n]; if(r&&r[0]==="d") return 'src="https://lh3.googleusercontent.com/d/'+r[1]+'=w'+r[2]+'" data-d="'+r[1]+'" data-w="'+r[2]+'" loading="lazy"'; return 'src="'+PX+'" data-r="'+n+'"'; });
    var b=$("#book"); b.innerHTML='<div class="tb">'+html+'</div>';
    b.addEventListener("error",function(e){ var im=e.target; if(im&&im.tagName==="IMG"&&im.getAttribute("data-d")&&!im.getAttribute("data-f")){ im.setAttribute("data-f","1"); im.src="https://drive.google.com/thumbnail?id="+im.getAttribute("data-d")+"&sz=w"+im.getAttribute("data-w"); } },true);
    toc(b);
    var lk=$("#lock"); lk.classList.add("out"); setTimeout(function(){ lk.hidden=true; b.hidden=false; window.scrollTo(0,0); },420);
    io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ io.unobserve(e.target); load(e.target); } }); },{rootMargin:"1600px 0px"});
    b.querySelectorAll("img[data-r]").forEach(function(im){ io.observe(im); });
    var so=new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; so.unobserve(e.target); sprite(e.target); }); },{rootMargin:"800px 0px"});
    b.querySelectorAll("figure[data-spr]").forEach(function(f){ so.observe(f); });
    b.addEventListener("click",play); }
  /* contents after the cover: every day and its stops, to jump to; a button brings you back from anywhere */
  function toc(b){ var tb=b.querySelector(".tb"), cover=tb.querySelector(".tb-cover"), n=0, h='<section class="tb-toc" id="toc"><p class="tb-kick">สารบัญ</p><h2>เลือกดูได้เลย</h2><ol>';
    function mark(el){ if(!el.id) el.id="tc"+(++n); return el.id; }
    var ov=tb.querySelector(".tb-ov"); if(ov) h+='<li class="tc-x"><a href="#'+mark(ov)+'">🗺️ ภาพรวมทริป</a></li>';
    tb.querySelectorAll(".tb-day").forEach(function(sec){ var dh=sec.querySelector(".tb-dh"); if(!dh) return; var dn=dh.querySelector(".tb-dn"), dt=dh.querySelector("p"), tt=dh.querySelector("h2"), dc=sec.style.getPropertyValue("--dc")||"#2F6FB3";
      var stops=[].slice.call(sec.querySelectorAll(".tb-stop h3")).map(function(h3){ var art=h3.closest(".tb-stop"); var sp=h3.querySelector("span"); var nm=[].slice.call(h3.childNodes).filter(function(x){ return x!==sp; }).map(function(x){ return x.textContent; }).join("").trim(); return '<a href="#'+mark(art)+'">'+(sp?'<b>'+sp.textContent+'</b>':'')+nm+'</a>'; });
      h+='<li style="--dc:'+dc+'"><a class="tc-d" href="#'+mark(sec)+'"><span class="tc-n">'+(dn?dn.textContent:"")+'</span><span><small>'+(dt?dt.textContent:"")+'</small>'+(tt?tt.textContent:"")+'</span></a>'+(stops.length?'<div class="tc-s">'+stops.join("")+'</div>':'')+'</li>'; });
    var x=tb.querySelector(".tb-x"); if(x) h+='<li class="tc-x"><a href="#'+mark(x)+'">📚 ท้ายเล่ม · เกร็ดเล็กเกร็ดน้อย</a></li>';
    h+='</ol></section>';
    if(cover) cover.insertAdjacentHTML("afterend",h); else tb.insertAdjacentHTML("afterbegin",h);
    var btn=document.createElement("button"); btn.id="tocb"; btn.type="button"; btn.innerHTML="☰ สารบัญ"; btn.hidden=true; document.body.appendChild(btn);
    btn.onclick=function(){ $("#toc").scrollIntoView({behavior:"smooth"}); };
    b.addEventListener("click",function(e){ var a=e.target.closest(".tb-toc a,.tc-back a"); if(!a) return; e.preventDefault(); var t=document.getElementById(a.getAttribute("href").slice(1)); if(t) t.scrollIntoView({behavior:"smooth"}); });
    btn.hidden=false;
    tb.querySelectorAll(".tb-day").forEach(function(sec){ sec.insertAdjacentHTML("beforeend",'<p class="tc-back"><a href="#toc">↑ กลับไปสารบัญ</a></p>'); }); }
  /* a video opens over the whole screen, at its own shape, with a close button */
  function closeVid(){ var o=$("#vo"); if(o){ o.remove(); document.body.style.overflow=""; } }
  async function play(e){ var sa=e.target.closest(".tb-showall"); if(sa){ var g=sa.previousElementSibling; if(g) g.classList.remove("clip"); sa.remove(); return; }
    var f=e.target.closest("figure[data-v]"); if(!f) return; var v=M.vids&&M.vids[f.getAttribute("data-v")]; if(!v) return;
    closeVid(); var o=document.createElement("div"); o.id="vo"; o.innerHTML='<button class="vx" aria-label="ปิด">✕</button><div class="vs"><p class="vw">กำลังโหลดวิดีโอ…</p></div>'; document.body.appendChild(o); document.body.style.overflow="hidden";
    o.querySelector(".vx").onclick=closeVid; var stg=o.querySelector(".vs");
    if(v[0]==="d"){ var fr=document.createElement("iframe"); fr.src="https://drive.google.com/file/d/"+v[1]+"/preview"; fr.setAttribute("allow","autoplay; fullscreen"); fr.setAttribute("allowfullscreen",""); stg.innerHTML=""; stg.appendChild(fr); return; }
    try{ var u=await unseal(KEY,await get(v[0],60000)); if(!$("#vo")) return; var el=document.createElement("video"); el.src=URL.createObjectURL(new Blob([u],{type:v[1]||"video/mp4"})); el.controls=true; el.autoplay=true; el.playsInline=true; el.setAttribute("playsinline","");
      stg.innerHTML=""; stg.appendChild(el); var pr=el.play(); if(pr&&pr.catch) pr.catch(function(){}); }
    catch(x){ stg.innerHTML='<p class="vw">โหลดวิดีโอไม่ได้ ลองอีกครั้ง</p>'; } }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeVid(); });
  var MSG={bad:"รหัสไม่ถูกต้อง ลองใหม่อีกครั้งนะ",gone:"ไม่พบ Tripbook นี้ อาจหยุดแชร์ไปแล้ว ลองขอลิงก์ใหม่จากคนที่ส่งมา",link:"ลิงก์ไม่ครบ ขอลิงก์ใหม่จากคนที่ส่งมา",old:"เบราว์เซอร์นี้เก่าเกินไป ลองเปิดด้วย Chrome หรือ Safari รุ่นใหม่",net:"เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วกดเปิดอีกครั้ง"};
  async function submit(ev){ if(ev) ev.preventDefault(); var pw=$("#pw").value; if(!norm(pw)){ err("ใส่รหัสก่อนนะ"); $("#pw").focus(); return; }
    err(""); why=[]; wait(true,MF?"กำลังตรวจรหัส…":"กำลังโหลด…"); try{ $("#pw").blur(); }catch(x){}
    try{ await unlock(pw); try{ if($("#rem").checked) localStorage.setItem("tbk:"+id,pw); else localStorage.removeItem("tbk:"+id); }catch(x){} wait(true,"กำลังเปิด…"); render(); return; }
    catch(x){ var m=x&&x.message; err(MSG[m]||MSG.net,m==="net"&&why.length?why.join(" · "):""); if(m==="bad"){ try{ localStorage.removeItem("tbk:"+id); }catch(y){} var i=$("#pw"); i.classList.remove("shake"); void i.offsetWidth; i.classList.add("shake"); i.select(); } }
    wait(false); }
  $("#f").addEventListener("submit",submit);
  if(!id){ $("#msg").textContent=MSG.link; $("#go").disabled=true; }
  else {
    var sv=null; try{ sv=localStorage.getItem("tbk:"+id); }catch(x){}
    loadMF().catch(function(e){ var m=e&&e.message; if(m==="gone"||m==="link") err(MSG[m]); });
    if(sv){ $("#pw").value=sv; submit(); }
  }
})();
</script>
</body>
</html>
